              @PluginMethod
              public void setQuality(final PluginCall call) {
                  final int h = call.getInt("height", 0);
                  ui(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              qualityH = h;
                              if (player != null) {
                                  TrackSelectionParameters.Builder b = player.getTrackSelectionParameters().buildUpon();
                                  b.setMaxVideoSize(Integer.MAX_VALUE, h > 0 ? h : Integer.MAX_VALUE);
                                  player.setTrackSelectionParameters(b.build());
                              }
                          } catch (Throwable t) {
                              // se queda con la calidad anterior
                          }
                          call.resolve();
                      }
                  });
              }

              /* pistas: el id es la posición en la lista (en subtítulos y audio, -1 = desactivado) */
              private ArrayList<Tracks.Group> groupsOf(int type, ArrayList<Integer> idx) {
                  ArrayList<Tracks.Group> out = new ArrayList<Tracks.Group>();
                  if (player == null) return out;
                  for (Tracks.Group g : player.getCurrentTracks().getGroups()) {
                      if (g.getType() != type) continue;
                      for (int i = 0; i < g.length; i++) {
                          out.add(g);
                          idx.add(i);
                      }
                  }
                  return out;
              }

              private void pickTrack(int type, int id) {
                  if (player == null) return;
                  TrackSelectionParameters.Builder b = player.getTrackSelectionParameters().buildUpon();
                  if (id < 0) {
                      b.setTrackTypeDisabled(type, true);
                  } else {
                      ArrayList<Integer> idx = new ArrayList<Integer>();
                      ArrayList<Tracks.Group> gs = groupsOf(type, idx);
                      if (id >= gs.size()) return;
                      b.setTrackTypeDisabled(type, false);
                      b.setOverrideForType(new TrackSelectionOverride(gs.get(id).getMediaTrackGroup(), idx.get(id)));
                  }
                  player.setTrackSelectionParameters(b.build());
              }

              @PluginMethod
              public void setAudio(final PluginCall call) {
                  final int id = call.getInt("id", -1);
                  ui(new Runnable() {
                      @Override
