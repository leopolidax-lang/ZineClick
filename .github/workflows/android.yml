              }

              private static String codecName(String mime) {
                  if (mime == null) return "";
                  if (MimeTypes.AUDIO_E_AC3_JOC.equals(mime)) return "Atmos";
                  if (MimeTypes.AUDIO_E_AC3.equals(mime)) return "EAC3";
                  if (MimeTypes.AUDIO_AC3.equals(mime)) return "AC3";
                  if (MimeTypes.AUDIO_AAC.equals(mime)) return "AAC";
                  if (MimeTypes.AUDIO_OPUS.equals(mime)) return "Opus";
                  if (MimeTypes.AUDIO_TRUEHD.equals(mime)) return "TrueHD";
                  if (MimeTypes.AUDIO_FLAC.equals(mime)) return "FLAC";
                  if (MimeTypes.AUDIO_MPEG.equals(mime)) return "MP3";
                  if (mime.startsWith("audio/vnd.dts")) return "DTS";
                  return "";
              }

              private static String chName(int n) {
                  if (n <= 0) return "";
                  if (n == 1) return "1.0";
                  if (n == 2) return "2.0";
                  if (n == 6) return "5.1";
                  if (n == 8) return "7.1";
                  return n + "ch";
              }

              /* El nombre termina con [Idioma] para que la página reconozca el idioma igual que con VLC. */
              private String trackName(Format f, int n, boolean audio) {
                  String lang = f.language;
                  String langName = "";
                  boolean latino = false;
                  if (lang != null && !lang.isEmpty() && !"und".equals(lang)) {
                      Locale loc = Locale.forLanguageTag(lang);
                      langName = loc.getDisplayLanguage(Locale.ENGLISH);
                      if (langName == null || langName.isEmpty()) langName = lang;
                      String rg = loc.getCountry();
                      if ("es".equals(loc.getLanguage()) && rg != null && !rg.isEmpty() && !"ES".equals(rg)) latino = true;
                  }
                  StringBuilder sb = new StringBuilder();
                  if (f.label != null && !f.label.isEmpty()) sb.append(f.label);
                  else if (!langName.isEmpty()) sb.append(langName).append(latino ? " (Latino)" : "");
                  else sb.append(audio ? "Audio " : "Subtítulo ").append(n + 1);
                  if (audio) {
                      String cd = codecName(f.sampleMimeType), ch = chName(f.channelCount);
                      String ex = (cd + " " + ch).trim();
                      if (!ex.isEmpty()) sb.append(" · ").append(ex);
                  }
                  if ((f.selectionFlags & C.SELECTION_FLAG_FORCED) != 0) sb.append(" · Forzado");
                  if (!langName.isEmpty()) sb.append(" [").append(langName).append("]");
                  return sb.toString();
              }

              private void fillTracks(JSArray out, int type, boolean audio, JSObject res, String curKey) {
                  JSObject off = new JSObject();
                  off.put("id", -1);
                  off.put("name", audio ? "Disable" : "Disable");
                  out.put(off);
                  int cur = -1;
                  ArrayList<Integer> idx = new ArrayList<Integer>();
                  ArrayList<Tracks.Group> gs = groupsOf(type, idx);
                  for (int k = 0; k < gs.size(); k++) {
                      Tracks.Group g = gs.get(k);
                      int i = idx.get(k);
                      JSObject t = new JSObject();
                      t.put("id", k);
                      t.put("name", trackName(g.getTrackFormat(i), k, audio));
                      out.put(t);
                      if (g.isTrackSelected(i)) cur = k;
                  }
                  res.put(curKey, cur);
              }

              @PluginMethod
              public void getTracks(final PluginCall call) {
                  ui(new Runnable() {
                      @Override
                      public void run() {
                          JSObject res = new JSObject();
                          JSArray audio = new JSArray();
                          JSArray subs = new JSArray();
                          try {
                              if (player != null) {
                                  fillTracks(audio, C.TRACK_TYPE_AUDIO, true, res, "audioCurrent");
                                  fillTracks(subs, C.TRACK_TYPE_TEXT, false, res, "subCurrent");
                                  /* sin pistas reales: la lista queda vacía para que la página lo reintente */
                                  if (audio.length() <= 1) audio = new JSArray();
                                  if (subs.length() <= 1) subs = new JSArray();
                              }
                          } catch (Throwable t) {
                              // se devuelven las listas que se hayan podido leer
                          }
                          res.put("quality", qualityH);
                          res.put("audio", audio);
                          res.put("subs", subs);
                          call.resolve(res);
                      }
                  });
              }

              /* ---------------- vista previa de escenas (al deslizar la barra) ---------------- */

              private synchronized MediaMetadataRetriever retriever(String u) {
                  if (!u.equals(mmrUrl)) {
                      closeRetriever();
                      mmrUrl = u;
                      mmrFailed = false;
                  }
                  if (mmrFailed || u.isEmpty()) return null;
                  if (mmr == null) {
                      try {
                          MediaMetadataRetriever r = new MediaMetadataRetriever();
                          HashMap<String, String> h = new HashMap<String, String>();
                          if (!referer.isEmpty()) h.put("Referer", referer);
                          r.setDataSource(u, h);
                          mmr = r;
                      } catch (Throwable t) {
                          mmrFailed = true;
                          mmr = null;
                      }
                  }
                  return mmr;
              }

              private synchronized void closeRetriever() {
                  try {
                      if (mmr != null) mmr.release();
                  } catch (Throwable t) {
                      // idem
                  }
                  mmr = null;
                  mmrUrl = "";
              }

              @PluginMethod
              public void getThumb(final PluginCall call) {
                  final double ms = call.getDouble("ms", 0.0);
                  final String u = url;
                  thumbEx.execute(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              MediaMetadataRetriever r = retriever(u);
                              if (r == null) {
                                  call.resolve(new JSObject());
                                  return;
                              }
                              Bitmap bmp = r.getFrameAtTime((long) (Math.max(ms, 0) * 1000), MediaMetadataRetriever.OPTION_CLOSEST_SYNC);
                              if (bmp == null) {
                                  call.resolve(new JSObject());
                                  return;
                              }
                              int w = 320;
                              int h = Math.max(1, bmp.getHeight() * w / Math.max(1, bmp.getWidth()));
                              Bitmap sm = Bitmap.createScaledBitmap(bmp, w, h, true);
                              ByteArrayOutputStream bo = new ByteArrayOutputStream();
                              sm.compress(Bitmap.CompressFormat.JPEG, 60, bo);
                              if (sm != bmp) bmp.recycle();
                              JSObject o = new JSObject();
                              o.put("data", "data:image/jpeg;base64," + Base64.encodeToString(bo.toByteArray(), Base64.NO_WRAP));
                              call.resolve(o);
                          } catch (Throwable t) {
                              call.resolve(new JSObject());
                          }
                      }
                  });
              }

              /* ---------------- ventana flotante (imagen en imagen) ---------------- */

              public boolean wantsPip() {
                  return active && !suspended && player != null;
              }

              public Rational pipRatio() {
                  return new Rational(16, 9);
              }

              public void pipWillEnter() {
                  pipEntering = true;
              }

              public void pipChanged(boolean on) {
                  JSObject o = new JSObject();
                  o.put("on", on);
                  notifyListeners("znpPip", o);
                  if (!on) {
                      pipEntering = false;
                      /* si la ventana flotante se cerró con la X (la app queda detenida), se pausa el video */
                      handler.postDelayed(new Runnable() {
                          @Override
                          public void run() {
                              try {
                                  if (player == null || !active || suspended) return;
                                  if (!uiResumed) handleOnStop();
                              } catch (Throwable t) {
                                  // sin efecto
                              }
                          }
                      }, 1000);
                  }
              }

              private boolean pipKeep() {
                  if (pipEntering) return true;
                  try {
                      Activity a = getActivity();
                      return a != null && Build.VERSION.SDK_INT >= 24 && a.isInPictureInPictureMode();
                  } catch (Throwable t) {
                      return false;
                  }
              }

              /* ---------------- ciclo de vida de la app ---------------- */

              @Override
              protected void handleOnPause() {
                  uiResumed = false;
              }

              @Override
              protected void handleOnResume() {
                  uiResumed = true;
              }

              @Override
              protected void handleOnStop() {
                  if (pipKeep()) return;
                  if (active && !suspended && player != null) {
                      try {
                          wasPlaying = player.getPlayWhenReady();
                          player.setPlayWhenReady(false);
                      } catch (Throwable t) {
                          // idem
                      }
                      suspended = true;
                  }
              }

              @Override
              protected void handleOnStart() {
                  if (active && suspended && player != null) {
                      suspended = false;
                      try {
                          if (wasPlaying) player.setPlayWhenReady(true);
                      } catch (Throwable t) {
                          // idem
                      }
                  }
              }

              @Override
              protected void handleOnDestroy() {
                  teardown();
              }
          }
