name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm install

      - name: Crear proyecto Android
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Poner ícono y pantalla de inicio propios
        continue-on-error: true
        run: |
          if [ -f icon.png ] && [ -f icon-foreground.png ]; then
            python3 -m venv /tmp/venv
            /tmp/venv/bin/pip install pillow
            /tmp/venv/bin/python - <<'PY'
          from PIL import Image, ImageDraw
          import glob, os
          res = 'android/app/src/main/res'
          full = Image.open('icon.png').convert('RGBA')
          fg = Image.open('icon-foreground.png').convert('RGBA')
          sizes = {'mdpi': (48, 108), 'hdpi': (72, 162), 'xhdpi': (96, 216),
                   'xxhdpi': (144, 324), 'xxxhdpi': (192, 432)}
          for d, (legacy, foreground) in sizes.items():
              folder = f'{res}/mipmap-{d}'
              os.makedirs(folder, exist_ok=True)
              full.resize((legacy, legacy), Image.LANCZOS).convert('RGB').save(f'{folder}/ic_launcher.png')
              r = full.resize((legacy, legacy), Image.LANCZOS)
              m = Image.new('L', (legacy * 4, legacy * 4), 0)
              ImageDraw.Draw(m).ellipse((0, 0, legacy * 4 - 1, legacy * 4 - 1), fill=255)
              r.putalpha(m.resize((legacy, legacy), Image.LANCZOS))
              r.save(f'{folder}/ic_launcher_round.png')
              fg.resize((foreground, foreground), Image.LANCZOS).save(f'{folder}/ic_launcher_foreground.png')
          os.makedirs(f'{res}/values', exist_ok=True)
          with open(f'{res}/values/ic_launcher_background.xml', 'w') as f:
              f.write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#000000</color>\n</resources>\n')
          for p in glob.glob(f'{res}/drawable*/splash.png'):
              w, h = Image.open(p).size
              Image.new('RGB', (w, h), (0, 0, 0)).save(p)
          print('Ícono y splash aplicados')
          PY
          fi

      - name: Sincronizar con Android
        run: npx cap sync android

      - name: Nombre de la app (Zinora)
        run: |
          F=android/app/src/main/res/values/strings.xml
          sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">Zinora</string>|' "$F"
          sed -i 's|<string name="title_activity_main">[^<]*</string>|<string name="title_activity_main">Zinora</string>|' "$F"
          grep -n "app_name\|title_activity_main" "$F"

      - name: Clave de firma fija (para poder actualizar sin desinstalar)
        run: |
          mkdir -p ~/.android
          if [ -f zineclick-debug.keystore ]; then
            cp zineclick-debug.keystore ~/.android/debug.keystore
            echo "Usando la clave fija del proyecto"
          else
            echo "::error::Falta el archivo zineclick-debug.keystore en la raiz del repositorio. Sin el no se puede actualizar la app sin desinstalar."
            exit 1
          fi

      - name: Número de versión (sube solo en cada compilación)
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Reproductor nativo con sonido (VLC) - opcional
        id: native
        continue-on-error: true
        run: |
          set -e
          PKG_DIR=android/app/src/main/java/com/zineclick/app
          test -d "$PKG_DIR"
          cp android/app/build.gradle android/app/build.gradle.bak
          cp android/app/src/main/AndroidManifest.xml android/app/src/main/AndroidManifest.xml.bak
          cp "$PKG_DIR/MainActivity.java" "$PKG_DIR/MainActivity.java.bak"
          cat > "$PKG_DIR/MainActivity.java" <<'JAVA_MAIN'
          package com.zineclick.app;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(ZinePlayerPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA_MAIN
          cat > "$PKG_DIR/ZinePlayerPlugin.java" <<'JAVA_PLUGIN'
          package com.zineclick.app;

          import android.content.Intent;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "ZinePlayer")
          public class ZinePlayerPlugin extends Plugin {
              @PluginMethod
              public void play(PluginCall call) {
                  String url = call.getString("url");
                  if (url == null || url.isEmpty()) {
                      call.reject("Falta el enlace");
                      return;
                  }
                  Intent i = new Intent(getActivity(), ZinePlayerActivity.class);
                  i.putExtra("url", url);
                  i.putExtra("title", call.getString("title", ""));
                  getActivity().startActivity(i);
                  call.resolve();
              }
          }
          JAVA_PLUGIN
          cat > "$PKG_DIR/ZinePlayerActivity.java" <<'JAVA_ACT'
          package com.zineclick.app;

          import android.app.Activity;
          import android.content.pm.ActivityInfo;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.SeekBar;
          import android.widget.TextView;
          import android.widget.Toast;

          import org.videolan.libvlc.LibVLC;
          import org.videolan.libvlc.Media;
          import org.videolan.libvlc.MediaPlayer;
          import org.videolan.libvlc.util.VLCVideoLayout;

          import java.util.ArrayList;
          import java.util.Locale;

          public class ZinePlayerActivity extends Activity {
              private LibVLC libVLC;
              private MediaPlayer player;
              private VLCVideoLayout videoLayout;
              private SeekBar seek;
              private TextView timeText;
              private Button playBtn;
              private LinearLayout controls;
              private boolean dragging = false;
              private long lastTime = 0;
              private String url;
              private final Handler handler = new Handler(Looper.getMainLooper());

              private final Runnable ticker = new Runnable() {
                  @Override
                  public void run() {
                      if (player != null && !dragging) {
                          long len = player.getLength();
                          long t = player.getTime();
                          if (len > 0) {
                              seek.setMax((int) (len / 1000));
                              seek.setProgress((int) (Math.max(t, 0) / 1000));
                              timeText.setText(fmt(t) + " / " + fmt(len));
                          }
                          playBtn.setText(player.isPlaying() ? "II" : "\u25B6");
                      }
                      handler.postDelayed(this, 500);
                  }
              };

              private int dp(int v) {
                  return (int) (v * getResources().getDisplayMetrics().density);
              }

              private Button makeButton(String text) {
                  Button b = new Button(this);
                  b.setText(text);
                  b.setTextColor(Color.WHITE);
                  b.setAllCaps(false);
                  b.setBackgroundColor(0x33FFFFFF);
                  b.setPadding(dp(10), 0, dp(10), 0);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, dp(40));
                  lp.setMargins(dp(4), 0, dp(4), 0);
                  b.setLayoutParams(lp);
                  return b;
              }

              private String fmt(long ms) {
                  long s = Math.max(ms, 0) / 1000;
                  long h = s / 3600;
                  long m = (s % 3600) / 60;
                  long sec = s % 60;
                  if (h > 0) return String.format(Locale.US, "%d:%02d:%02d", h, m, sec);
                  return String.format(Locale.US, "%d:%02d", m, sec);
              }

              @SuppressWarnings("deprecation")
              private void hideBars() {
                  getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                                  | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                                  | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                                  | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                                  | View.SYSTEM_UI_FLAG_FULLSCREEN
                                  | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  url = getIntent().getStringExtra("url");
                  String title = getIntent().getStringExtra("title");
                  setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  hideBars();

                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(Color.BLACK);

                  videoLayout = new VLCVideoLayout(this);
                  root.addView(videoLayout, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  videoLayout.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          controls.setVisibility(controls.getVisibility() == View.VISIBLE ? View.GONE : View.VISIBLE);
                      }
                  });

                  controls = new LinearLayout(this);
                  controls.setOrientation(LinearLayout.HORIZONTAL);
                  controls.setGravity(Gravity.CENTER_VERTICAL);
                  controls.setBackgroundColor(0xAA000000);
                  controls.setPadding(dp(10), dp(8), dp(10), dp(8));

                  playBtn = makeButton("II");
                  playBtn.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          if (player.isPlaying()) player.pause(); else player.play();
                      }
                  });
                  controls.addView(playBtn);

                  seek = new SeekBar(this);
                  controls.addView(seek, new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f));
                  seek.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      @Override
                      public void onProgressChanged(SeekBar s, int p, boolean fromUser) {
                          if (fromUser && player != null) timeText.setText(fmt(p * 1000L) + " / " + fmt(player.getLength()));
                      }

                      @Override
                      public void onStartTrackingTouch(SeekBar s) {
                          dragging = true;
                      }

                      @Override
                      public void onStopTrackingTouch(SeekBar s) {
                          if (player != null) player.setTime(s.getProgress() * 1000L);
                          dragging = false;
                      }
                  });

                  timeText = new TextView(this);
                  timeText.setTextColor(Color.WHITE);
                  timeText.setText("0:00");
                  timeText.setPadding(dp(8), 0, dp(8), 0);
                  controls.addView(timeText);

                  Button audioBtn = makeButton("Audio");
                  audioBtn.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          cycleAudio();
                      }
                  });
                  controls.addView(audioBtn);

                  Button subsBtn = makeButton("Subt.");
                  subsBtn.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          cycleSubs();
                      }
                  });
                  controls.addView(subsBtn);

                  Button closeBtn = makeButton("X");
                  closeBtn.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          finish();
                      }
                  });
                  controls.addView(closeBtn);

                  FrameLayout.LayoutParams lp = new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT, Gravity.BOTTOM);
                  root.addView(controls, lp);
                  setContentView(root);

                  ArrayList<String> args = new ArrayList<String>();
                  args.add("--network-caching=3000");
                  args.add("--file-caching=3000");
                  libVLC = new LibVLC(this, args);
                  player = new MediaPlayer(libVLC);

                  if (title != null && !title.isEmpty()) Toast.makeText(this, title, Toast.LENGTH_SHORT).show();
                  handler.post(ticker);
              }

              @Override
              protected void onStart() {
                  super.onStart();
                  player.attachViews(videoLayout, null, true, false);
                  Media media = new Media(libVLC, Uri.parse(url));
                  player.setMedia(media);
                  media.release();
                  player.play();
                  if (lastTime > 1000) {
                      final long resumeAt = lastTime;
                      handler.postDelayed(new Runnable() {
                          @Override
                          public void run() {
                              if (player != null) player.setTime(resumeAt);
                          }
                      }, 1500);
                  }
              }

              @Override
              protected void onStop() {
                  super.onStop();
                  lastTime = player.getTime();
                  player.stop();
                  player.detachViews();
              }

              @Override
              protected void onDestroy() {
                  handler.removeCallbacksAndMessages(null);
                  if (player != null) player.release();
                  if (libVLC != null) libVLC.release();
                  super.onDestroy();
              }

              private void cycleAudio() {
                  MediaPlayer.TrackDescription[] tracks = player.getAudioTracks();
                  if (tracks == null || tracks.length < 2) {
                      Toast.makeText(this, "No hay otras pistas de audio", Toast.LENGTH_SHORT).show();
                      return;
                  }
                  int cur = player.getAudioTrack();
                  int idx = 0;
                  for (int i = 0; i < tracks.length; i++) if (tracks[i].id == cur) idx = i;
                  MediaPlayer.TrackDescription next = tracks[(idx + 1) % tracks.length];
                  player.setAudioTrack(next.id);
                  Toast.makeText(this, "Audio: " + next.name, Toast.LENGTH_SHORT).show();
              }

              private void cycleSubs() {
                  MediaPlayer.TrackDescription[] tracks = player.getSpuTracks();
                  if (tracks == null || tracks.length < 2) {
                      Toast.makeText(this, "Este video no trae subtítulos", Toast.LENGTH_SHORT).show();
                      return;
                  }
                  int cur = player.getSpuTrack();
                  int idx = 0;
                  for (int i = 0; i < tracks.length; i++) if (tracks[i].id == cur) idx = i;
                  MediaPlayer.TrackDescription next = tracks[(idx + 1) % tracks.length];
                  player.setSpuTrack(next.id);
                  Toast.makeText(this, "Subtítulos: " + next.name, Toast.LENGTH_SHORT).show();
              }
          }
          JAVA_ACT
          python3 - <<'PY'
          import re
          p = 'android/app/build.gradle'
          s = open(p, encoding='utf-8').read()
          if 'libvlc-all' not in s:
              s = s.replace('dependencies {', "dependencies {\n    implementation 'org.videolan.android:libvlc-all:3.6.0'", 1)
              s = re.sub(r'(versionName\s+"[^"]*")', r"\1\n        ndk { abiFilters 'arm64-v8a' }", s, count=1)
          open(p, 'w', encoding='utf-8').write(s)
          m = 'android/app/src/main/AndroidManifest.xml'
          t = open(m, encoding='utf-8').read()
          if 'ZinePlayerActivity' not in t:
              t = t.replace('</application>', '    <activity android:name=".ZinePlayerActivity" android:exported="false" android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout|uiMode" android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen" />\n    </application>', 1)
          open(m, 'w', encoding='utf-8').write(t)
          PY
          echo "Reproductor nativo instalado"

      - name: Compilar APK
        id: build
        continue-on-error: true
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Plan B - compilar sin el reproductor nativo
        if: steps.build.outcome == 'failure'
        working-directory: android
        run: |
          echo "::warning::El reproductor nativo no compiló. Se genera el APK sin él (el video se verá en el reproductor interno)."
          PKG_DIR=app/src/main/java/com/zineclick/app
          [ -f app/build.gradle.bak ] && cp app/build.gradle.bak app/build.gradle || true
          [ -f app/src/main/AndroidManifest.xml.bak ] && cp app/src/main/AndroidManifest.xml.bak app/src/main/AndroidManifest.xml || true
          [ -f "$PKG_DIR/MainActivity.java.bak" ] && cp "$PKG_DIR/MainActivity.java.bak" "$PKG_DIR/MainActivity.java" || true
          rm -f "$PKG_DIR/ZinePlayerPlugin.java" "$PKG_DIR/ZinePlayerActivity.java"
          ./gradlew assembleDebug

      - name: Huella de la firma (debe ser igual en todas las versiones)
        continue-on-error: true
        run: |
          keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA256" || true

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Zinora-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
