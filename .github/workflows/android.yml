      - name: Mejora - servidor local para video disfrazado de imagen (rpmvid)
        id: proxy
        if: steps.native.outcome == 'success'
        continue-on-error: true
        run: |
          snap() { rm -rf "/tmp/snap_$1"; mkdir -p "/tmp/snap_$1"; cp -a android/app/src/main "/tmp/snap_$1/main"; cp android/app/build.gradle "/tmp/snap_$1/build.gradle"; }
          snap proxy
          PKG_DIR=android/app/src/main/java/com/zineclick/app
          test -f "$PKG_DIR/ZinePlayerPlugin.java"
          cat > "$PKG_DIR/ZineProxy.java" <<'JAVA_PROXY'
          package com.zineclick.app;

          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.InetAddress;
          import java.net.ServerSocket;
          import java.net.Socket;
          import java.net.URL;
          import java.net.URLDecoder;
          import java.net.URLEncoder;
          import java.nio.charset.StandardCharsets;
          import java.util.concurrent.Callable;
          import java.util.concurrent.ConcurrentHashMap;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          import java.util.concurrent.Future;
          import java.util.concurrent.TimeUnit;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          /**
           * Servidor local (127.0.0.1) para videos HLS cuyos trocitos vienen disfrazados de imagen PNG.
           * Descarga la lista y cada trocito con las cabeceras correctas, reescribe las direcciones para
           * que pasen por aqui y le quita al trocito la cabecera falsa de PNG antes de dárselo a VLC.
           */
          public class ZineProxy {
              private static ServerSocket server;
              private static int port = 0;
              private static volatile String referer = "";
              private static volatile String agent = "";
              private static final String UA_DEF = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36";
              private static final Pattern URI_ATTR = Pattern.compile("URI=\"([^\"]+)\"");

              /** Solo envuelve las listas de rpmvid/cubeembed; cualquier otra dirección queda igual. */
              public static synchronized String wrap(String url, String ref, String ua) {
                  try {
                      if (url == null || !url.startsWith("http")) return url;
                      String low = url.toLowerCase();
                      if (!((low.contains("rpmvid.com") || low.contains("okcdn.ru") || low.contains("mycdn.me")) && low.contains(".m3u8"))) return url;
                      return wrapForce(url, ref, ua);
                  } catch (Throwable t) {
                      return url;
                  }
              }

              /** Envuelve cualquier lista .m3u8 (se usa cuando VLC no logra la conexión directa). */
              public static synchronized String wrapAlways(String url, String ref, String ua) {
                  try {
                      if (url == null || !url.startsWith("http")) return url;
                      if (!url.toLowerCase().contains(".m3u8")) return url;
                      return wrapForce(url, ref, ua);
                  } catch (Throwable t) {
                      return url;
                  }
              }

              static synchronized String wrapForce(String url, String ref, String ua) {
                  try {
                      referer = ref == null ? "" : ref;
                      agent = ua == null ? "" : ua;
                      start();
                      if (port == 0) return url;
                      return proxied(url);
                  } catch (Throwable t) {
                      return url;
                  }
              }

              private static String proxied(String abs) throws Exception {
                  return "http://127.0.0.1:" + port + "/p?u=" + URLEncoder.encode(abs, "UTF-8");
              }

              private static void start() throws Exception {
                  if (server != null && !server.isClosed()) return;
                  server = new ServerSocket(0, 64, InetAddress.getByName("127.0.0.1"));
                  port = server.getLocalPort();
                  final ServerSocket ss = server;
                  Thread t = new Thread(new Runnable() {
                      @Override
                      public void run() {
                          while (!ss.isClosed()) {
                              try {
                                  final Socket s = ss.accept();
                                  Thread w = new Thread(new Runnable() {
                                      @Override
                                      public void run() {
                                          handle(s);
                                      }
                                  });
                                  w.setDaemon(true);
                                  w.start();
                              } catch (Throwable e) {
                                  break;
                              }
                          }
                      }
                  });
                  t.setDaemon(true);
                  t.start();
              }

              private static String readLine(InputStream in) throws Exception {
                  StringBuilder sb = new StringBuilder();
                  int c;
                  while ((c = in.read()) != -1) {
                      if (c == '\n') break;
                      if (c != '\r') sb.append((char) c);
                      if (sb.length() > 16384) break;
                  }
                  return sb.toString();
              }

              private static void send(OutputStream out, int code, String type, byte[] body) throws Exception {
                  String head = "HTTP/1.1 " + code + (code == 200 ? " OK" : " Error") + "\r\n"
                          + "Content-Type: " + type + "\r\n"
                          + "Content-Length: " + body.length + "\r\n"
                          + "Cache-Control: no-store\r\n"
                          + "Connection: close\r\n\r\n";
                  out.write(head.getBytes(StandardCharsets.ISO_8859_1));
                  out.write(body);
                  out.flush();
              }

              private static void handle(Socket s) {
                  try {
                      s.setSoTimeout(30000);
                      InputStream in = s.getInputStream();
                      OutputStream out = s.getOutputStream();
                      String req = readLine(in);
                      String line;
                      while ((line = readLine(in)).length() > 0) {
                          // se ignoran las cabeceras del cliente (incluido Range)
                      }
                      int i = req.indexOf("u=");
                      int sp = req.indexOf(' ', 4);
                      if (i < 0 || sp < 0 || i > sp) {
                          send(out, 404, "text/plain", new byte[0]);
                          s.close();
                          return;
                      }
                      String u = URLDecoder.decode(req.substring(i + 2, sp), "UTF-8");
                      Object[] got = fetch(u);
                      if (got == null) {
                          send(out, 502, "text/plain", new byte[0]);
                          s.close();
                          return;
                      }
                      int code = ((Integer) got[0]).intValue();
                      if (code >= 400) {
                          send(out, code, "text/plain", new byte[0]);
                          s.close();
                          return;
                      }
                      String finalUrl = (String) got[1];
                      byte[] data = (byte[]) got[2];
                      String path = u;
                      int q = path.indexOf('?');
                      if (q >= 0) path = path.substring(0, q);
                      boolean playlist = path.toLowerCase().endsWith(".m3u8")
                              || (data.length > 7 && data[0] == '#' && data[1] == 'E' && data[2] == 'X' && data[3] == 'T' && data[4] == 'M' && data[5] == '3' && data[6] == 'U');
                      if (playlist) {
                          send(out, 200, "application/vnd.apple.mpegurl", rewrite(new String(data, StandardCharsets.UTF_8), finalUrl).getBytes(StandardCharsets.UTF_8));
                      } else {
                          send(out, 200, "video/mp2t", strip(data));
                      }
                      s.close();
                  } catch (Throwable e) {
                      try {
                          s.close();
                      } catch (Throwable e2) {
                          // nada
                      }
                  }
              }

              private static final ConcurrentHashMap<String, String> nextOf = new ConcurrentHashMap<String, String>();
              private static final ConcurrentHashMap<String, Future<Object[]>> pre = new ConcurrentHashMap<String, Future<Object[]>>();
              private static final ExecutorService pool = Executors.newFixedThreadPool(4);

              /** Entrega el trozo ya precargado si existe; si no, lo descarga. Luego precarga los siguientes. */
              private static Object[] fetch(String u) {
                  Object[] r = null;
                  Future<Object[]> f = pre.remove(u);
                  if (f != null) {
                      try {
                          r = f.get(40, TimeUnit.SECONDS);
                      } catch (Throwable e) {
                          r = null;
                      }
                  }
                  if (r == null) r = download(u);
                  prefetchNext(u);
                  return r;
              }

              private static void prefetchNext(String cur) {
                  try {
                      if (nextOf.size() > 4000) nextOf.clear();
                      String n = cur;
                      for (int i = 0; i < 4; i++) {
                          n = nextOf.get(n);
                          if (n == null) return;
                          if (pre.containsKey(n)) continue;
                          if (pre.size() > 12) pre.clear();
                          final String target = n;
                          pre.put(target, pool.submit(new Callable<Object[]>() {
                              @Override
                              public Object[] call() {
                                  return download(target);
                              }
                          }));
                      }
                  } catch (Throwable e) {
                      // la precarga es opcional
                  }
              }

              /** Descarga con hasta 6 intentos; devuelve {codigo, urlFinal, bytes} o null si todo falla. */
              private static Object[] download(String u) {
                  int code = 0;
                  for (int attempt = 0; attempt < 6; attempt++) {
                      HttpURLConnection c = null;
                      boolean keep = false;
                      try {
                          if (attempt > 0) Thread.sleep(Math.min(400L * attempt, 1500L));
                          c = (HttpURLConnection) new URL(u).openConnection();
                          c.setInstanceFollowRedirects(true);
                          c.setConnectTimeout(15000);
                          c.setReadTimeout(30000);
                          String ua = agent.isEmpty() ? UA_DEF : agent;
                          c.setRequestProperty("User-Agent", ua);
                          c.setRequestProperty("Accept", "*/*");
                          c.setRequestProperty("Accept-Language", "es-419,es;q=0.9");
                          String ref = referer;
                          if (!ref.isEmpty()) {
                              c.setRequestProperty("Referer", ref);
                              try {
                                  URL r = new URL(ref);
                                  c.setRequestProperty("Origin", r.getProtocol() + "://" + r.getHost() + (r.getPort() > 0 ? ":" + r.getPort() : ""));
                              } catch (Throwable e) {
                                  // sin Origin
                              }
                          }
                          code = c.getResponseCode();
                          if (code == 429 || code >= 500) {
                              continue;
                          }
                          if (code >= 400) {
                              return new Object[] { Integer.valueOf(code), u, new byte[0] };
                          }
                          String finalUrl = c.getURL().toString();
                          long declared = c.getContentLengthLong();
                          boolean plain = c.getContentEncoding() == null;
                          InputStream up = c.getInputStream();
                          ByteArrayOutputStream bo = new ByteArrayOutputStream();
                          byte[] buf = new byte[32768];
                          int n;
                          long total = 0;
                          while ((n = up.read(buf)) != -1) {
                              bo.write(buf, 0, n);
                              total += n;
                              if (total > 80L * 1024 * 1024) break;
                          }
                          up.close();
                          byte[] data = bo.toByteArray();
                          if (plain && declared >= 0 && data.length != declared) {
                              continue; // descarga cortada: se reintenta
                          }
                          keep = true;
                          return new Object[] { Integer.valueOf(code), finalUrl, data };
                      } catch (Throwable e) {
                          // se reintenta
                      } finally {
                          if (c != null && !keep) {
                              try {
                                  c.disconnect();
                              } catch (Throwable e2) {
                                  // nada
                              }
                          }
                      }
                  }
                  return null;
              }

              private static String resolve(String base, String rel) {
                  try {
                      return new URL(new URL(base), rel).toString();
                  } catch (Throwable t) {
                      return rel;
                  }
              }

              private static String rewrite(String text, String base) throws Exception {
                  StringBuilder sb = new StringBuilder();
                  String[] lines = text.split("\r?\n");
                  boolean media = text.indexOf("#EXTINF") >= 0;
                  String prevSeg = null;
                  for (String l : lines) {
                      String tr = l.trim();
                      if (tr.isEmpty()) {
                          sb.append("\n");
                      } else if (tr.charAt(0) == '#') {
                          Matcher m = URI_ATTR.matcher(tr);
                          StringBuffer out = new StringBuffer();
                          while (m.find()) {
                              String abs = resolve(base, m.group(1));
                              m.appendReplacement(out, Matcher.quoteReplacement("URI=\"" + proxied(abs) + "\""));
                          }
                          m.appendTail(out);
                          sb.append(out).append("\n");
                      } else {
                          String abs = resolve(base, tr);
                          if (media) {
                              if (prevSeg != null) nextOf.put(prevSeg, abs);
                              prevSeg = abs;
                          }
                          sb.append(proxied(abs)).append("\n");
                      }
                  }
                  return sb.toString();
              }

              /** Quita la cabecera falsa de PNG: el video real empieza justo después del bloque IEND. */
              static byte[] strip(byte[] d) {
                  if (d.length < 64) return d;
                  boolean png = (d[0] & 0xFF) == 0x89 && d[1] == 'P' && d[2] == 'N' && d[3] == 'G';
                  if (!png) return d;
                  int lim = Math.min(d.length - 8, 8192);
                  int off = -1;
                  for (int i = 8; i < lim; i++) {
                      if (d[i] == 'I' && d[i + 1] == 'E' && d[i + 2] == 'N' && d[i + 3] == 'D') {
                          off = i + 8;
                          break;
                      }
                  }
                  if (off < 0 || off >= d.length) {
                      // sin IEND: se busca el primer paquete TS (0x47 cada 188 bytes)
                      int lim2 = Math.min(d.length - 400, 8192);
                      for (int i = 0; i < lim2; i++) {
                          if (d[i] == 0x47 && d[i + 188] == 0x47 && d[i + 376] == 0x47) {
                              off = i;
                              break;
                          }
                      }
                  }
                  if (off <= 0 || off >= d.length) return d;
                  byte[] r = new byte[d.length - off];
                  System.arraycopy(d, off, r, 0, r.length);
                  return r;
              }
          }
