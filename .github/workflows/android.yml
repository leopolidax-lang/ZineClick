              @PluginMethod
              public void play(final PluginCall call) {
                  final String u = call.getString("url");
                  final String rf = call.getString("referer", "");
                  final String ag = call.getString("userAgent", "");
                  if (u == null || u.isEmpty()) {
                      call.reject("Falta el enlace");
                      return;
                  }
                  ui(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              referer = rf;
                              uagent = ag;
                              startPlayback(u);
                              call.resolve();
                          } catch (Throwable t) {
                              teardown();
                              restoreWindow();
                              call.reject("No se pudo iniciar VLC: " + t.getMessage());
                          }
                      }
                  });
              }

              @PluginMethod
              public void stop(final PluginCall call) {
                  ui(new Runnable() {
                      @Override
                      public void run() {
                          teardown();
                          restoreWindow();
                          call.resolve();
                      }
                  });
              }

              @PluginMethod
              public void togglePlay(final PluginCall call) {
                  ui(new Runnable() {
                      @Override
                      public void run() {
                          if (player != null) {
                              if (call.hasOption("play")) {
                                  if (call.getBoolean("play", true)) player.play(); else player.pause();
                              } else if (player.isPlaying()) player.pause(); else player.play();
                          }
                          call.resolve();
                      }
                  });
              }

              /* hora del último salto manual (barra, botones de 10 s, continuar donde ibas) */
              private long lastSeekAt = 0;

              @PluginMethod
              public void seekTo(final PluginCall call) {
                  final double ms = call.getDouble("ms", 0.0);
                  ui(new Runnable() {
                      @Override
                      public void run() {
                          lastSeekAt = System.currentTimeMillis();
                          if (player != null) player.setTime((long) Math.max(ms, 0));
                          call.resolve();
                      }
                  });
              }

              @PluginMethod
              public void seekBy(final PluginCall call) {
                  final double ms = call.getDouble("ms", 0.0);
                  ui(new Runnable() {
                      @Override
                      public void run() {
                          if (player != null) {
                              long len = player.getLength();
                              long t = player.getTime() + (long) ms;
                              if (t < 0) t = 0;
                              if (len > 0 && t > len - 500) t = len - 500;
                              lastSeekAt = System.currentTimeMillis();
                              player.setTime(t);
                          }
                          call.resolve();
                      }
                  });
              }

              @PluginMethod
              public void setRate(final PluginCall call) {
                  final double r = call.getDouble("rate", 1.0);
                  ui(new Runnable() {
                      @Override
                      public void run() {
                          if (player != null) player.setRate((float) r);
                          call.resolve();
                      }
                  });
              }

              @PluginMethod
              public void setAspect(final PluginCall call) {
                  final String m = call.getString("mode", "fit");
                  ui(new Runnable() {
                      @Override
