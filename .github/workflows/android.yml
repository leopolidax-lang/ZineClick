                      }
                  }

                  void finish() {
                      if (!done.compareAndSet(false, true)) return;
                      handler.removeCallbacks(finishRun);
                      try {
                          if (wv != null) {
                              wv.stopLoading();
                              wv.setWebViewClient(new WebViewClient());
