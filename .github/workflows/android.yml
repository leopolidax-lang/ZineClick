           * Abre una página en un WebView invisible, deja que ella misma pida su video y devuelve
           * las direcciones de video (.m3u8, .mp4...) que vio pasar, con las cabeceras que usó.
           */
          @CapacitorPlugin(name = "ZineBrowser")
          public class ZineBrowserPlugin extends Plugin {
              private final Handler handler = new Handler(Looper.getMainLooper());
              private final ExecutorService queueEx = Executors.newCachedThreadPool();
              private final Semaphore slots = new Semaphore(4);

              private static final String PLAY_JS = "(function(){try{var v=document.querySelectorAll('video');"
                      + "for(var i=0;i<v.length;i++){v[i].muted=true;var p=v[i].play();if(p&&p.catch){p.catch(function(){});}}"
                      + "var sel=['.jw-icon-display','.jw-display-icon-container','.vjs-big-play-button','.plyr__control--overlaid',"
                      + "'.play-button','.btn-play','#play','.fp-play','.dplayer-play-icon','[class*=play]'];"
                      + "for(var j=0;j<sel.length;j++){var e=document.querySelector(sel[j]);if(e){try{e.click();}catch(x){}}}"
                      + "}catch(err){}})();";

              private static String pathOf(String u) {
                  String low = u.toLowerCase(Locale.ROOT);
                  int q = low.indexOf('?');
                  return q >= 0 ? low.substring(0, q) : low;
              }

              private static boolean isHls(String u) {
                  return pathOf(u).contains(".m3u8");
              }

              private static boolean isMedia(String u) {
                  String low = u.toLowerCase(Locale.ROOT);
                  if (low.contains("doubleclick") || low.contains("googlesyndication") || low.contains("adservice")) return false;
                  String p = pathOf(u);
                  return p.contains(".m3u8") || p.endsWith(".mp4") || p.endsWith(".mpd") || p.endsWith(".webm") || p.endsWith(".mkv");
              }

              @PluginMethod
              public void capture(final PluginCall call) {
                  final String u = call.getString("url");
                  if (u == null || !u.startsWith("http")) {
                      call.reject("Falta la dirección");
                      return;
                  }
                  final JSObject hj = call.getObject("headers");
                  int t = call.getInt("timeoutMs", 10000);
                  if (t < 2000) t = 2000;
                  if (t > 15000) t = 15000;
                  final int timeout = t;
                  queueEx.execute(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              slots.acquire();
                          } catch (InterruptedException e) {
                              call.reject("cancelado");
                              return;
                          }
                          final Job job = new Job(call, u, hj, timeout);
                          getActivity().runOnUiThread(new Runnable() {
                              @Override
                              public void run() {
                                  job.start();
                              }
                          });
                      }
                  });
              }

              private class Job {
