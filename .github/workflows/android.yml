name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm install

      - name: Crear proyecto Android
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Poner ícono y pantalla de inicio propios
        continue-on-error: true
        run: |
          if [ -f icon.png ] && [ -f icon-foreground.png ]; then
            python3 -m venv /tmp/venv
            /tmp/venv/bin/pip install pillow
            /tmp/venv/bin/python - <<'PY'
          from PIL import Image, ImageDraw
          import glob, os
          res = 'android/app/src/main/res'
          full = Image.open('icon.png').convert('RGBA')
          fg = Image.open('icon-foreground.png').convert('RGBA')
          sizes = {'mdpi': (48, 108), 'hdpi': (72, 162), 'xhdpi': (96, 216),
                   'xxhdpi': (144, 324), 'xxxhdpi': (192, 432)}
          for d, (legacy, foreground) in sizes.items():
              folder = f'{res}/mipmap-{d}'
              os.makedirs(folder, exist_ok=True)
              full.resize((legacy, legacy), Image.LANCZOS).convert('RGB').save(f'{folder}/ic_launcher.png')
              r = full.resize((legacy, legacy), Image.LANCZOS)
              m = Image.new('L', (legacy * 4, legacy * 4), 0)
              ImageDraw.Draw(m).ellipse((0, 0, legacy * 4 - 1, legacy * 4 - 1), fill=255)
              r.putalpha(m.resize((legacy, legacy), Image.LANCZOS))
              r.save(f'{folder}/ic_launcher_round.png')
              fg.resize((foreground, foreground), Image.LANCZOS).save(f'{folder}/ic_launcher_foreground.png')
          os.makedirs(f'{res}/values', exist_ok=True)
          with open(f'{res}/values/ic_launcher_background.xml', 'w') as f:
              f.write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#000000</color>\n</resources>\n')
          for p in glob.glob(f'{res}/drawable*/splash.png'):
              w, h = Image.open(p).size
              Image.new('RGB', (w, h), (0, 0, 0)).save(p)
          print('Ícono y splash aplicados')
          PY
          fi

      - name: Sincronizar con Android
        run: npx cap sync android

      - name: Clave de firma fija (para poder actualizar sin desinstalar)
        run: |
          mkdir -p ~/.android
          if [ -f zineclick-debug.keystore ]; then
            cp zineclick-debug.keystore ~/.android/debug.keystore
            echo "Usando la clave fija del proyecto"
          else
            echo "ATENCION: falta zineclick-debug.keystore en el repositorio"
          fi

      - name: Número de versión (sube solo en cada compilación)
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: ZineClick-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
