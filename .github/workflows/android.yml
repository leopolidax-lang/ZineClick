              @PluginMethod
              public void setAudio(final PluginCall call) {
                  final int id = call.getInt("id", -1);
                  ui(new Runnable() {
                      @Override
                      public void run() {
                          if (player != null) player.setAudioTrack(id);
                          call.resolve();
                      }
                  });
              }

              @PluginMethod
              public void setQuality(final PluginCall call) {
                  final int h = call.getInt("height", 0);
                  ui(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              qualityH = h;
                              if (player != null && active) {
                                  final long rt = Math.max(player.getTime(), 0L);
                                  player.stop();
                                  player.detachViews();
                                  attachAndPlay(rt, true);
                              }
                          } catch (Throwable t) {
                              // si no se puede reiniciar, se queda con la calidad anterior
                          }
                          call.resolve();
                      }
                  });
              }

              @PluginMethod
              public void setSubtitle(final PluginCall call) {
                  final int id = call.getInt("id", -1);
                  ui(new Runnable() {
                      @Override
                      public void run() {
                          if (player != null) player.setSpuTrack(id);
                          call.resolve();
                      }
                  });
              }

              @PluginMethod
              public void getTracks(final PluginCall call) {
                  ui(new Runnable() {
                      @Override
                      public void run() {
                          JSObject res = new JSObject();
                          JSArray audio = new JSArray();
                          JSArray subs = new JSArray();
                          try {
                              if (player != null) {
                                  MediaPlayer.TrackDescription[] a = player.getAudioTracks();
                                  if (a != null) for (MediaPlayer.TrackDescription d : a) {
                                      JSObject t = new JSObject();
                                      t.put("id", d.id);
                                      t.put("name", d.name == null ? "" : d.name);
                                      audio.put(t);
                                  }
                                  MediaPlayer.TrackDescription[] s = player.getSpuTracks();
                                  if (s != null) for (MediaPlayer.TrackDescription d : s) {
                                      JSObject t = new JSObject();
                                      t.put("id", d.id);
                                      t.put("name", d.name == null ? "" : d.name);
                                      subs.put(t);
                                  }
                                  res.put("audioCurrent", player.getAudioTrack());
                                  res.put("subCurrent", player.getSpuTrack());
                              }
                          } catch (Throwable t) {
                              // se devuelven las listas que se hayan podido leer
                          }
                          res.put("quality", qualityH);
                          res.put("audio", audio);
                          res.put("subs", subs);
                          call.resolve(res);
                      }
                  });
              }

              /* ---------------- vista previa de escenas (al deslizar la barra) ---------------- */

              private synchronized MediaMetadataRetriever retriever(String u) {
                  if (!u.equals(mmrUrl)) {
                      closeRetriever();
                      mmrUrl = u;
                      mmrFailed = false;
                  }
                  if (mmrFailed || u.isEmpty()) return null;
                  if (mmr == null) {
                      try {
                          MediaMetadataRetriever r = new MediaMetadataRetriever();
                          r.setDataSource(u, new HashMap<String, String>());
                          mmr = r;
                      } catch (Throwable t) {
                          mmrFailed = true;
                          mmr = null;
                      }
                  }
                  return mmr;
              }

              private synchronized void closeRetriever() {
                  try {
                      if (mmr != null) mmr.release();
                  } catch (Throwable t) {
                      // idem
                  }
                  mmr = null;
                  mmrUrl = "";
              }

              @PluginMethod
              public void getThumb(final PluginCall call) {
                  final double ms = call.getDouble("ms", 0.0);
                  final String u = url;
                  thumbEx.execute(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              MediaMetadataRetriever r = retriever(u);
                              if (r == null) {
                                  call.resolve(new JSObject());
                                  return;
                              }
                              Bitmap bmp = r.getFrameAtTime((long) (Math.max(ms, 0) * 1000), MediaMetadataRetriever.OPTION_CLOSEST_SYNC);
                              if (bmp == null) {
                                  call.resolve(new JSObject());
                                  return;
                              }
                              int w = 320;
                              int h = Math.max(1, bmp.getHeight() * w / Math.max(1, bmp.getWidth()));
                              Bitmap sm = Bitmap.createScaledBitmap(bmp, w, h, true);
                              ByteArrayOutputStream bo = new ByteArrayOutputStream();
                              sm.compress(Bitmap.CompressFormat.JPEG, 60, bo);
                              if (sm != bmp) bmp.recycle();
                              JSObject o = new JSObject();
                              o.put("data", "data:image/jpeg;base64," + Base64.encodeToString(bo.toByteArray(), Base64.NO_WRAP));
                              call.resolve(o);
                          } catch (Throwable t) {
                              call.resolve(new JSObject());
                          }
                      }
                  });
              }

              /* ---------------- ciclo de vida de la app ---------------- */

              @Override
              protected void handleOnStop() {
                  if (active && !suspended && player != null) {
                      try {
                          resumeAt = player.getTime();
                          resumePlaying = player.isPlaying();
                          player.stop();
                          player.detachViews();
                      } catch (Throwable t) {
                          // idem
                      }
                      suspended = true;
                  }
              }

              @Override
              protected void handleOnStart() {
                  if (active && suspended && player != null) {
                      suspended = false;
                      try {
                          attachAndPlay(resumeAt, resumePlaying);
                      } catch (Throwable t) {
                          // idem
                      }
                  }
              }

              @Override
              protected void handleOnDestroy() {
                  teardown();
              }
          }
