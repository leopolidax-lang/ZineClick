          /**
           * Reproductor ExoPlayer (Media3) sin pantalla propia: el video se dibuja DETRÁS del WebView
           * y los controles son HTML (native-player.js). Mismos métodos y eventos que ZinePlayer (VLC),
           * para que la página pueda cambiar de uno a otro.
           */
          @UnstableApi
          @CapacitorPlugin(name = "ZineExo")
          public class ZineExoPlugin extends Plugin {
              private ExoPlayer player;
              private PlayerView view;
              private FrameLayout box;
              private ViewGroup parent;
              private final Handler handler = new Handler(Looper.getMainLooper());
              private final ExecutorService thumbEx = Executors.newSingleThreadExecutor();
              private String url = "";
              private String referer = "";
              private String uagent = "";
              private String subSize = "";
              private String subBg = "";
              private String aspect = "fit";
              private boolean active = false;
              private boolean suspended = false;
              private boolean wasPlaying = true;
              private boolean audioChecked = false;
              private int retries = 0;
              private int qualityH = 0;
              private volatile boolean pipEntering = false;
              private volatile boolean uiResumed = true;
              private MediaMetadataRetriever mmr;
              private String mmrUrl = "";
              private boolean mmrFailed = false;

              private static final String DEFAULT_UA =
                      "Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36";

              private void ui(Runnable r) {
                  Activity a = getActivity();
                  if (a != null) a.runOnUiThread(r);
              }

              /* ---------------- estado hacia la página ---------------- */

              private void pushState() {
                  try {
                      if (!active || suspended || player == null) return;
                      int st = player.getPlaybackState();
                      JSObject o = new JSObject();
                      o.put("time", Math.max(player.getCurrentPosition(), 0L));
                      o.put("length", Math.max(player.getDuration(), 0L));
                      o.put("playing", player.getPlayWhenReady() && st != Player.STATE_ENDED && st != Player.STATE_IDLE);
                      o.put("buffering", st == Player.STATE_BUFFERING);
                      notifyListeners("znpState", o);
                  } catch (Throwable t) {
                      // se ignora: el próximo ciclo lo reintenta
                  }
              }

              private final Runnable ticker = new Runnable() {
                  @Override
                  public void run() {
                      pushState();
                      if (active) handler.postDelayed(this, 500);
                  }
              };

              private final Player.Listener listener = new Player.Listener() {
                  @Override
                  public void onPlaybackStateChanged(int state) {
                      if (state == Player.STATE_ENDED) {
                          notifyListeners("znpEnded", new JSObject());
                      } else if (state == Player.STATE_READY) {
                          retries = 0;
                      }
                      pushState();
                  }

                  @Override
                  public void onIsPlayingChanged(boolean isPlaying) {
                      pushState();
                  }

                  @Override
                  public void onTracksChanged(Tracks tracks) {
                      checkSupport(tracks);
                  }

                  @Override
                  public void onPlayerError(PlaybackException e) {
                      handleError(e);
                  }
              };

              /* Si el teléfono no puede decodificar el audio o el video del archivo, se avisa para pasar a VLC. */
              private void checkSupport(Tracks tracks) {
                  if (audioChecked || !active) return;
                  try {
                      boolean hasAudio = false, audioOk = false, hasVideo = false, videoOk = false;
                      for (Tracks.Group g : tracks.getGroups()) {
                          for (int i = 0; i < g.length; i++) {
                              if (g.getType() == C.TRACK_TYPE_AUDIO) {
                                  hasAudio = true;
                                  if (g.isTrackSupported(i)) audioOk = true;
                              } else if (g.getType() == C.TRACK_TYPE_VIDEO) {
                                  hasVideo = true;
                                  if (g.isTrackSupported(i)) videoOk = true;
                              }
                          }
                      }
                      if ((hasAudio && !audioOk) || (hasVideo && !videoOk)) {
                          audioChecked = true;
                          JSObject o = new JSObject();
                          o.put("message", hasAudio && !audioOk ? "ExoPlayer: audio no compatible" : "ExoPlayer: video no compatible");
                          notifyListeners("znpError", o);
                      } else if (hasAudio || hasVideo) {
                          audioChecked = true;
                      }
                  } catch (Throwable t) {
                      // sin efecto
                  }
              }

              private void handleError(PlaybackException e) {
                  if (!active || player == null) return;
                  if (!suspended && retries < 2) {
                      retries++;
                      final long rt = Math.max(player.getCurrentPosition(), 0L);
                      handler.postDelayed(new Runnable() {
                          @Override
                          public void run() {
                              try {
                                  if (player == null || !active || suspended) return;
                                  loadMedia(rt, true);
                              } catch (Throwable t) {
                                  // si el reintento falla, el siguiente error avisa a la página
                              }
                          }
                      }, 800);
                      return;
                  }
                  JSObject o = new JSObject();
                  o.put("message", "ExoPlayer no pudo reproducir este video (" + e.getErrorCodeName() + ")");
                  notifyListeners("znpError", o);
              }

              /* ---------------- pantalla, orientación, barras ---------------- */

              private void immersive(boolean on) {
                  Activity a = getActivity();
                  if (a == null) return;
                  try {
                      WindowInsetsControllerCompat c = WindowCompat.getInsetsController(a.getWindow(), a.getWindow().getDecorView());
                      if (c == null) return;
                      if (on) {
                          c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                          c.hide(WindowInsetsCompat.Type.systemBars());
                      } else {
                          c.show(WindowInsetsCompat.Type.systemBars());
                      }
                      if (Build.VERSION.SDK_INT >= 28) {
                          WindowManager.LayoutParams lp = a.getWindow().getAttributes();
                          lp.layoutInDisplayCutoutMode = on
                                  ? WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                                  : WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_DEFAULT;
                          a.getWindow().setAttributes(lp);
                      }
                  } catch (Throwable t) {
                      // las barras del sistema no son críticas
                  }
              }

              private void restoreWindow() {
                  Activity a = getActivity();
                  if (a == null) return;
                  try {
                      a.setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED);
                      a.getWindow().clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                      immersive(false);
                      WebView wv = getBridge().getWebView();
                      if (wv != null) wv.setBackgroundColor(Color.BLACK);
                  } catch (Throwable t) {
                      // idem
                  }
              }

              private void applyAspect() {
                  if (view == null || box == null) return;
                  try {
                      FrameLayout.LayoutParams lp = (FrameLayout.LayoutParams) view.getLayoutParams();
                      boolean ratio = "16:9".equals(aspect) || "4:3".equals(aspect);
                      if (ratio) {
                          float r = "16:9".equals(aspect) ? 16f / 9f : 4f / 3f;
                          int bw = box.getWidth(), bh = box.getHeight();
                          if (bw > 0 && bh > 0) {
                              if ((float) bw / (float) bh > r) {
                                  lp.height = bh;
                                  lp.width = Math.round(bh * r);
                              } else {
                                  lp.width = bw;
                                  lp.height = Math.round(bw / r);
                              }
                          }
                          view.setResizeMode(AspectRatioFrameLayout.RESIZE_MODE_FILL);
                      } else {
                          lp.width = ViewGroup.LayoutParams.MATCH_PARENT;
                          lp.height = ViewGroup.LayoutParams.MATCH_PARENT;
                          if ("zoom".equals(aspect)) view.setResizeMode(AspectRatioFrameLayout.RESIZE_MODE_ZOOM);
                          else if ("fill".equals(aspect)) view.setResizeMode(AspectRatioFrameLayout.RESIZE_MODE_FILL);
                          else view.setResizeMode(AspectRatioFrameLayout.RESIZE_MODE_FIT);
                      }
                      lp.gravity = Gravity.CENTER;
                      view.setLayoutParams(lp);
                  } catch (Throwable t) {
                      // sin efecto
                  }
              }

              private void applySubStyle() {
                  if (view == null) return;
                  try {
                      SubtitleView sv = view.getSubtitleView();
                      if (sv == null) return;
                      float f = 0.0533f;
                      if ("s".equals(subSize)) f = 0.042f;
                      else if ("l".equals(subSize)) f = 0.07f;
                      else if ("xl".equals(subSize)) f = 0.09f;
                      int bg = Color.TRANSPARENT;
                      int edge = CaptionStyleCompat.EDGE_TYPE_OUTLINE;
                      if ("shadow".equals(subBg)) {
                          edge = CaptionStyleCompat.EDGE_TYPE_DROP_SHADOW;
                      } else if ("light".equals(subBg)) {
                          bg = Color.argb(110, 0, 0, 0);
                          edge = CaptionStyleCompat.EDGE_TYPE_NONE;
                      } else if ("normal".equals(subBg)) {
                          bg = Color.argb(170, 0, 0, 0);
                          edge = CaptionStyleCompat.EDGE_TYPE_NONE;
                      } else if ("solid".equals(subBg)) {
                          bg = Color.argb(255, 0, 0, 0);
                          edge = CaptionStyleCompat.EDGE_TYPE_NONE;
                      }
                      sv.setApplyEmbeddedStyles(false);
                      sv.setApplyEmbeddedFontSizes(false);
                      sv.setFractionalTextSize(f);
                      sv.setStyle(new CaptionStyleCompat(Color.WHITE, bg, Color.TRANSPARENT, edge, Color.BLACK, null));
                  } catch (Throwable t) {
                      // sin efecto
                  }
              }

              /* ---------------- abrir el video ---------------- */

              /* Las listas de rpmvid/cubeembed pasan por el servidor local (ZineProxy) si existe en esta compilación. */
              private String proxied(String u, boolean always) {
                  try {
                      Class<?> c = Class.forName("com.zineclick.app.ZineProxy");
                      java.lang.reflect.Method m = c.getMethod(always ? "wrapAlways" : "wrap", String.class, String.class, String.class);
                      Object r = m.invoke(null, u, referer, uagent);
                      return r instanceof String ? (String) r : u;
                  } catch (Throwable t) {
                      return u;
                  }
              }

              private MediaItem buildItem(boolean always) {
                  String low = url.toLowerCase(Locale.ROOT);
                  MediaItem.Builder b = new MediaItem.Builder().setUri(Uri.parse(proxied(url, always)));
                  if (low.contains(".m3u8")) b.setMimeType(MimeTypes.APPLICATION_M3U8);
                  else if (low.contains(".mpd")) b.setMimeType(MimeTypes.APPLICATION_MPD);
                  return b.build();
              }

              private void loadMedia(long startAt, boolean always) {
                  if (player == null) return;
                  player.setMediaItem(buildItem(always && url.toLowerCase(Locale.ROOT).contains(".m3u8")), Math.max(startAt, 0L));
                  player.prepare();
                  player.setPlayWhenReady(true);
              }

              private void startPlayback(String u) {
                  teardown();
                  Activity a = getActivity();
                  WebView wv = getBridge().getWebView();
                  parent = (ViewGroup) wv.getParent();
                  box = new FrameLayout(a);
                  box.setBackgroundColor(Color.BLACK);
                  view = new PlayerView(a);
                  view.setUseController(false);
                  view.setShutterBackgroundColor(Color.BLACK);
                  box.addView(view, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT, Gravity.CENTER));
                  parent.addView(box, 0, new ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  wv.setBackgroundColor(Color.TRANSPARENT);
                  a.setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE);
                  a.getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  immersive(true);

                  url = u;
                  aspect = "fit";
                  active = true;
                  suspended = false;
                  audioChecked = false;
                  retries = 0;
                  qualityH = 0;
                  pipEntering = false;

                  DefaultHttpDataSource.Factory http = new DefaultHttpDataSource.Factory()
                          .setAllowCrossProtocolRedirects(true)
                          .setConnectTimeoutMs(15000)
                          .setReadTimeoutMs(25000)
                          .setUserAgent(uagent.isEmpty() ? DEFAULT_UA : uagent);
                  if (!referer.isEmpty()) {
                      HashMap<String, String> h = new HashMap<String, String>();
                      h.put("Referer", referer);
                      http.setDefaultRequestProperties(h);
                  }
                  DefaultMediaSourceFactory msf = new DefaultMediaSourceFactory(a)
                          .setDataSourceFactory(new DefaultDataSource.Factory(a, http));
                  DefaultRenderersFactory rf = new DefaultRenderersFactory(a)
                          .setExtensionRendererMode(DefaultRenderersFactory.EXTENSION_RENDERER_MODE_ON)
                          .setEnableDecoderFallback(true);
                  DefaultLoadControl lc = new DefaultLoadControl.Builder()
                          .setBufferDurationsMs(30000, 120000, 2500, 5000)
                          .build();
                  player = new ExoPlayer.Builder(a, rf)
                          .setMediaSourceFactory(msf)
                          .setTrackSelector(new DefaultTrackSelector(a))
                          .setLoadControl(lc)
                          .setHandleAudioBecomingNoisy(true)
                          .build();
                  player.setAudioAttributes(new AudioAttributes.Builder()
                          .setUsage(C.USAGE_MEDIA)
                          .setContentType(C.AUDIO_CONTENT_TYPE_MOVIE)
                          .build(), true);
                  player.addListener(listener);
                  view.setPlayer(player);
                  applySubStyle();
                  applyAspect();
                  loadMedia(0, false);
                  handler.removeCallbacks(ticker);
                  handler.post(ticker);
              }

              private void teardown() {
                  active = false;
                  suspended = false;
                  handler.removeCallbacksAndMessages(null);
                  final ExoPlayer old = player;
                  player = null;
                  try {
                      if (view != null) view.setPlayer(null);
                  } catch (Throwable t) {
                      // se sigue liberando el resto
                  }
                  try {
                      if (old != null) {
                          old.removeListener(listener);
                          old.stop();
                          old.release();
                      }
                  } catch (Throwable t) {
                      // idem
                  }
                  try {
                      if (box != null && parent != null) parent.removeView(box);
                  } catch (Throwable t) {
                      // idem
                  }
                  box = null;
                  view = null;
                  thumbEx.execute(new Runnable() {
                      @Override
                      public void run() {
                          closeRetriever();
                      }
                  });
              }

              /* ---------------- métodos que llama la página ---------------- */

              @PluginMethod
              public void play(final PluginCall call) {
                  final String u = call.getString("url");
                  final String rf = call.getString("referer", "");
                  final String ag = call.getString("userAgent", "");
                  final String ssz = call.getString("subSize", "");
                  final String sbg = call.getString("subBg", "");
                  if (u == null || u.isEmpty()) {
                      call.reject("Falta el enlace");
                      return;
                  }
                  ui(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              referer = rf == null ? "" : rf;
                              uagent = ag == null ? "" : ag;
                              subSize = ssz == null ? "" : ssz;
                              subBg = sbg == null ? "" : sbg;
                              startPlayback(u);
                              call.resolve();
                          } catch (Throwable t) {
                              teardown();
                              restoreWindow();
                              call.reject("No se pudo iniciar ExoPlayer: " + t.getMessage());
                          }
                      }
                  });
              }

              @PluginMethod
              public void stop(final PluginCall call) {
                  ui(new Runnable() {
                      @Override
                      public void run() {
                          teardown();
                          restoreWindow();
                          call.resolve();
                      }
                  });
              }

              @PluginMethod
              public void togglePlay(final PluginCall call) {
                  ui(new Runnable() {
                      @Override
                      public void run() {
                          if (player != null) {
                              if (call.hasOption("play")) {
                                  player.setPlayWhenReady(call.getBoolean("play", true));
                              } else {
                                  player.setPlayWhenReady(!player.getPlayWhenReady());
                              }
                              pushState();
                          }
                          call.resolve();
                      }
                  });
              }

              @PluginMethod
              public void seekTo(final PluginCall call) {
                  final double ms = call.getDouble("ms", 0.0);
                  ui(new Runnable() {
                      @Override
                      public void run() {
                          if (player != null) player.seekTo((long) Math.max(ms, 0));
                          call.resolve();
                      }
                  });
              }

              @PluginMethod
              public void seekBy(final PluginCall call) {
                  final double ms = call.getDouble("ms", 0.0);
                  ui(new Runnable() {
                      @Override
                      public void run() {
                          if (player != null) {
                              long len = player.getDuration();
                              long t = player.getCurrentPosition() + (long) ms;
                              if (t < 0) t = 0;
                              if (len > 0 && t > len - 500) t = len - 500;
                              player.seekTo(Math.max(t, 0L));
                          }
                          call.resolve();
                      }
                  });
              }

              @PluginMethod
              public void setRate(final PluginCall call) {
                  final double r = call.getDouble("rate", 1.0);
                  ui(new Runnable() {
                      @Override
                      public void run() {
                          if (player != null) player.setPlaybackParameters(new PlaybackParameters((float) r));
                          call.resolve();
                      }
                  });
              }

              @PluginMethod
              public void setAspect(final PluginCall call) {
                  final String m = call.getString("mode", "fit");
                  ui(new Runnable() {
                      @Override
                      public void run() {
