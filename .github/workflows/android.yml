                                          if (ref == null || ref.isEmpty()) ref = pageUrl;
                                          if (org == null || org.isEmpty()) {
                                              try {
                                                  java.net.URL pu = new java.net.URL(ref);
                                                  org = pu.getProtocol() + "://" + pu.getHost() + (pu.getPort() > 0 ? ":" + pu.getPort() : "");
                                              } catch (Throwable t) {
                                                  org = "";
                                              }
                                          }
                                          JSObject h = new JSObject();
                                          h.put("User-Agent", ua);
                                          h.put("Referer", ref);
                                          if (!org.isEmpty()) h.put("Origin", org);
                                          String ck = CookieManager.getInstance().getCookie(u);
                                          if (ck != null && !ck.isEmpty()) h.put("Cookie", ck);
