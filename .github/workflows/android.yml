                      thumbPlayer = new MediaPlayer(libVLC);
                      thumbPlayer.attachViews(thumbLayout, null, false, true);
                      Media tm = new Media(libVLC, Uri.parse(url));
                      tm.addOption(":no-audio");
                      thumbPlayer.setMedia(tm);
                      tm.release();
                      thumbPlayer.setVolume(0);
                      thumbPlayer.play();
                      thumbUrl = url;
                  } catch (Throwable t) {
                      thumbClose();
                  }
              }

              private TextureView findTexture(View v) {
                  if (v instanceof TextureView) return (TextureView) v;
                  if (v instanceof ViewGroup) {
                      ViewGroup g = (ViewGroup) v;
                      for (int i = 0; i < g.getChildCount(); i++) {
                          TextureView t = findTexture(g.getChildAt(i));
                          if (t != null) return t;
                      }
                  }
                  return null;
              }

              private boolean thumbIsDark(Bitmap b) {
                  int w = b.getWidth();
                  int h = b.getHeight();
                  for (int i = 1; i <= 5; i++) {
                      for (int j = 1; j <= 5; j++) {
                          int c = b.getPixel(w * i / 6, h * j / 6);
                          if (Color.red(c) + Color.green(c) + Color.blue(c) > 24) return false;
                      }
                  }
                  return true;
              }

              private void thumbGrab(PluginCall call) {
                  try {
                      TextureView tv = thumbLayout != null ? findTexture(thumbLayout) : null;
                      if (tv == null || !tv.isAvailable()) {
                          call.resolve(new JSObject());
                          return;
                      }
                      Bitmap bmp = tv.getBitmap(320, 180);
                      if (thumbPlayer != null && thumbPlayer.isPlaying()) thumbPlayer.pause();
                      if (bmp == null || thumbIsDark(bmp)) {
                          call.resolve(new JSObject());
                          return;
                      }
                      ByteArrayOutputStream bo = new ByteArrayOutputStream();
                      bmp.compress(Bitmap.CompressFormat.JPEG, 60, bo);
                      bmp.recycle();
                      JSObject o = new JSObject();
                      o.put("data", "data:image/jpeg;base64," + Base64.encodeToString(bo.toByteArray(), Base64.NO_WRAP));
                      call.resolve(o);
                  } catch (Throwable t) {
                      call.resolve(new JSObject());
                  }
              }

              private void vlcThumb(final double ms, final PluginCall call) {
                  ui(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              if (!active || libVLC == null || videoParent == null) {
                                  call.resolve(new JSObject());
                                  return;
                              }
                              boolean fresh = thumbPlayer == null || !url.equals(thumbUrl);
                              if (fresh) thumbOpen();
                              if (thumbPlayer == null) {
                                  call.resolve(new JSObject());
                                  return;
                              }
                              handler.removeCallbacks(thumbIdle);
                              handler.postDelayed(thumbIdle, 45000);
                              if (!thumbPlayer.isPlaying()) thumbPlayer.play();
                              final long at = (long) Math.max(ms, 0);
                              long wait = fresh ? 900 : 0;
                              handler.postDelayed(new Runnable() {
                                  @Override
                                  public void run() {
                                      try {
                                          if (thumbPlayer != null) thumbPlayer.setTime(at);
                                      } catch (Throwable t) {
                                          // sin efecto
                                      }
                                  }
                              }, wait);
                              handler.postDelayed(new Runnable() {
                                  @Override
                                  public void run() {
                                      thumbGrab(call);
                                  }
                              }, wait + 800);
                          } catch (Throwable t) {
                              call.resolve(new JSObject());
                          }
                      }
                  });
              }
          """
          s = load(PLUGIN)
          s = rep(s, 'import android.view.ViewGroup;\n', 'import android.view.TextureView;\nimport android.view.View;\nimport android.view.ViewGroup;\n')
          s = rep(s, '    private boolean mmrFailed = false;\n', '    private boolean mmrFailed = false;\n    private MediaPlayer thumbPlayer = null;\n    private VLCVideoLayout thumbLayout = null;\n    private String thumbUrl = "";\n')
          s = rep(s, '    private void teardown() {\n', '    private void teardown() {\n        thumbClose();\n')
          a = s.index('    public void getThumb(final PluginCall call) {')
          b = s.index('    /* ----------------', a)
          seg = s[a:b]
          r1 = '                    if (r == null) {\n                        call.resolve(new JSObject());\n                        return;\n                    }'
          r2 = '                    if (bmp == null) {\n                        call.resolve(new JSObject());\n                        return;\n                    }'
          r3 = '                } catch (Throwable t) {\n                    call.resolve(new JSObject());\n                }'
          for r in (r1, r2, r3):
              assert seg.count(r) == 1, 'getThumb: no se encontró un bloque'
          seg = seg.replace(r1, '                    if (r == null) {\n                        vlcThumb(ms, call);\n                        return;\n                    }')
          seg = seg.replace(r2, '                    if (bmp == null) {\n                        vlcThumb(ms, call);\n                        return;\n                    }')
          seg = seg.replace(r3, '                } catch (Throwable t) {\n                    vlcThumb(ms, call);\n                }')
          s = s[:a] + seg + s[b:]
          s = rep(s, LIFE, THUMB + '\n' + LIFE)
          save(PLUGIN, s)
          print('Miniaturas con VLC habilitadas')
          PY


      - name: Compilar APK
        id: build
        continue-on-error: true
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Plan B1 - compilar sin las miniaturas de VLC
        id: build2
        if: steps.build.outcome == 'failure' && steps.thumbs.outcome != 'skipped'
        continue-on-error: true
        working-directory: android
        run: |
          restore() { rm -rf app/src/main; cp -a "/tmp/snap_$1/main" app/src/main; cp "/tmp/snap_$1/build.gradle" app/build.gradle; }
          echo "::warning::Las miniaturas con VLC no compilaron. Se genera el APK sin ellas."
          test -d "/tmp/snap_thumbs"
          restore thumbs
          ./gradlew assembleDebug


      - name: Plan B2 - compilar sin Chromecast
        id: build3
        if: steps.build.outcome == 'failure' && steps.build2.outcome != 'success' && steps.cast.outcome != 'skipped'
        continue-on-error: true
        working-directory: android
        run: |
          restore() { rm -rf app/src/main; cp -a "/tmp/snap_$1/main" app/src/main; cp "/tmp/snap_$1/build.gradle" app/build.gradle; }
          echo "::warning::Chromecast no compiló. Se genera el APK sin él."
          test -d "/tmp/snap_cast"
          restore cast
          ./gradlew assembleDebug


      - name: Plan B3 - compilar sin ventana flotante
        id: build4
        if: steps.build.outcome == 'failure' && steps.build2.outcome != 'success' && steps.build3.outcome != 'success' && steps.pip.outcome != 'skipped'
        continue-on-error: true
        working-directory: android
        run: |
          restore() { rm -rf app/src/main; cp -a "/tmp/snap_$1/main" app/src/main; cp "/tmp/snap_$1/build.gradle" app/build.gradle; }
          echo "::warning::La ventana flotante no compiló. Se genera el APK sin ella."
          test -d "/tmp/snap_pip"
          restore pip
          ./gradlew assembleDebug


      - name: Plan B4 - compilar sin las mejoras del reproductor
        id: build5
        if: steps.build.outcome == 'failure' && steps.build2.outcome != 'success' && steps.build3.outcome != 'success' && steps.build4.outcome != 'success' && steps.tracks.outcome != 'skipped'
        continue-on-error: true
        working-directory: android
        run: |
          restore() { rm -rf app/src/main; cp -a "/tmp/snap_$1/main" app/src/main; cp "/tmp/snap_$1/build.gradle" app/build.gradle; }
          echo "::warning::Ninguna mejora del reproductor compiló. Se genera el APK con el reproductor básico."
          test -d "/tmp/snap_tracks"
          restore tracks
          ./gradlew assembleDebug


      - name: Plan B - compilar sin el reproductor nativo
        if: steps.build.outcome == 'failure' && steps.build2.outcome != 'success' && steps.build3.outcome != 'success' && steps.build4.outcome != 'success' && steps.build5.outcome != 'success'
        working-directory: android
        run: |
          echo "::warning::El reproductor nativo no compiló. Se genera el APK sin él (el video se verá en el reproductor interno)."
          PKG_DIR=app/src/main/java/com/zineclick/app
          [ -f app/build.gradle.bak ] && cp app/build.gradle.bak app/build.gradle || true
          [ -f app/src/main/AndroidManifest.xml.bak ] && cp app/src/main/AndroidManifest.xml.bak app/src/main/AndroidManifest.xml || true
          [ -f "$PKG_DIR/MainActivity.java.bak" ] && cp "$PKG_DIR/MainActivity.java.bak" "$PKG_DIR/MainActivity.java" || true
          rm -f "$PKG_DIR/ZinePlayerPlugin.java"
          ./gradlew assembleDebug

      - name: Verificar que el APK está firmado con la clave fija
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/cert.txt
          APK_SHA=$(grep -m1 "SHA-256 digest" /tmp/cert.txt | sed 's/.*: *//' | tr -d ': ' | tr 'A-F' 'a-f')
          VC=$(grep -m1 "versionCode" android/app/build.gradle | tr -dc '0-9')
          if [ "$APK_SHA" != "$KS_SHA_NORM" ]; then
            echo "::error::El APK quedó firmado con OTRA clave ($APK_SHA). No se publicará."
            exit 1
          fi
          cp "$APK" "Zynora-v1.0.${{ github.run_number }}.apk"
          {
            echo "### Zynora v1.0.${{ github.run_number }}"
            echo "- versionCode: \`$VC\`"
            echo "- Firma SHA-256: \`$APK_SHA\`"
            echo "- Si esta huella es igual a la de la compilación anterior, esta versión se instala encima de la anterior."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar APK
        uses: actions/upload-artifact@v6
        with:
          name: Zynora-APK
          path: Zynora-v1.0.${{ github.run_number }}.apk
