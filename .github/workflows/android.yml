          LIFE = '    /* ---------------- ciclo de vida de la app ---------------- */\n'

          CAST = """
              /* ---------------- Chromecast (descubrimiento y envío con VLC) ---------------- */

              private final RendererDiscoverer.EventListener rendererListener = new RendererDiscoverer.EventListener() {
                  @Override
                  public void onEvent(RendererDiscoverer.Event event) {
                      try {
                          RendererItem it = event.getItem();
                          if (it == null) return;
                          synchronized (renderers) {
                              if (event.type == RendererDiscoverer.Event.ItemAdded) {
                                  it.retain();
                                  renderers.add(it);
                              } else if (event.type == RendererDiscoverer.Event.ItemDeleted) {
                                  for (int i = renderers.size() - 1; i >= 0; i--) {
                                      if (renderers.get(i).name.equals(it.name)) {
                                          renderers.get(i).release();
                                          renderers.remove(i);
                                      }
                                  }
                              }
                          }
                      } catch (Throwable t) {
                          // un evento raro no debe tumbar el reproductor
                      }
                  }
              };

              private void castDiscoveryStart() {
                  if (!discoverers.isEmpty() || libVLC == null) return;
                  try {
                      WifiManager wm = (WifiManager) getActivity().getApplicationContext().getSystemService(Context.WIFI_SERVICE);
                      if (wm != null) {
                          mcLock = wm.createMulticastLock("zine-cast");
                          mcLock.setReferenceCounted(false);
                          mcLock.acquire();
                      }
                  } catch (Throwable t) {
                      // sin el candado de multicast algunos routers no muestran dispositivos
                  }
                  try {
                      RendererDiscoverer.Description[] ds = RendererDiscoverer.list(libVLC);
                      if (ds == null) return;
                      for (int i = 0; i < ds.length; i++) {
                          RendererDiscoverer rd = new RendererDiscoverer(libVLC, ds[i].name);
                          rd.setEventListener(rendererListener);
                          if (rd.start()) discoverers.add(rd); else rd.release();
                      }
                  } catch (Throwable t) {
                      // sin descubrimiento: la lista queda vacía
                  }
              }

              private void castDiscoveryStop() {
                  try {
                      if (player != null && castItem != null) player.setRenderer(null);
                  } catch (Throwable t) {
                      // idem
                  }
                  for (int i = 0; i < discoverers.size(); i++) {
                      try {
                          RendererDiscoverer rd = discoverers.get(i);
                          rd.stop();
                          rd.setEventListener(null);
                          rd.release();
                      } catch (Throwable t) {
                          // idem
                      }
                  }
                  discoverers.clear();
                  synchronized (renderers) {
                      for (int i = 0; i < renderers.size(); i++) {
                          try {
                              renderers.get(i).release();
                          } catch (Throwable t) {
                              // idem
                          }
                      }
                      renderers.clear();
                  }
                  if (castItem != null) {
                      try {
                          castItem.release();
                      } catch (Throwable t) {
                          // idem
                      }
                      castItem = null;
                  }
                  try {
                      if (mcLock != null && mcLock.isHeld()) mcLock.release();
                  } catch (Throwable t) {
                      // idem
                  }
                  mcLock = null;
              }

              @PluginMethod
              public void castList(final PluginCall call) {
                  ui(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              castDiscoveryStart();
                              JSObject o = new JSObject();
                              JSArray arr = new JSArray();
                              synchronized (renderers) {
                                  for (int i = 0; i < renderers.size(); i++) {
                                      JSObject d = new JSObject();
                                      d.put("id", i);
                                      d.put("name", renderers.get(i).displayName);
                                      arr.put(d);
                                  }
                              }
                              o.put("devices", arr);
                              o.put("current", castItem != null ? castItem.displayName : "");
                              call.resolve(o);
                          } catch (Throwable t) {
                              call.reject("No se pudo buscar dispositivos");
                          }
                      }
                  });
              }

              @PluginMethod
              public void castTo(final PluginCall call) {
                  final int id = call.getInt("id", -1);
                  ui(new Runnable() {
                      @Override
                      public void run() {
                          if (player == null || !active) {
                              call.reject("sin reproducción");
                              return;
                          }
                          RendererItem target = null;
                          synchronized (renderers) {
                              if (id >= 0 && id < renderers.size()) target = renderers.get(id);
                          }
                          if (id >= 0 && target == null) {
                              call.reject("dispositivo no disponible");
                              return;
                          }
                          try {
                              long t = Math.max(player.getTime(), 0L);
                              player.stop();
                              player.detachViews();
                              if (castItem != null) {
                                  try {
                                      castItem.release();
                                  } catch (Throwable x) {
                                      // idem
                                  }
                              }
                              castItem = target;
                              if (castItem != null) castItem.retain();
                              player.setRenderer(castItem);
                              attachAndPlay(t, true);
                              JSObject o = new JSObject();
                              o.put("current", castItem != null ? castItem.displayName : "");
                              call.resolve(o);
                          } catch (Throwable x) {
                              call.reject("No se pudo transmitir");
                          }
                      }
                  });
              }
