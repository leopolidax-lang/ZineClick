name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm install

      - name: Preparar www (app web + supabase-js + configuración)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: node scripts/prepare-www.mjs

      - name: Crear proyecto Android
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Poner ícono y pantalla de inicio propios
        continue-on-error: true
        run: |
          if [ -f icon.png ] && [ -f icon-foreground.png ]; then
            python3 -m venv /tmp/venv
            /tmp/venv/bin/pip install pillow
            /tmp/venv/bin/python - <<'PY'
          from PIL import Image, ImageDraw
          import glob, os
          res = 'android/app/src/main/res'
          full = Image.open('icon.png').convert('RGBA')
          fg = Image.open('icon-foreground.png').convert('RGBA')
          sizes = {'mdpi': (48, 108), 'hdpi': (72, 162), 'xhdpi': (96, 216),
                   'xxhdpi': (144, 324), 'xxxhdpi': (192, 432)}
          for d, (legacy, foreground) in sizes.items():
              folder = f'{res}/mipmap-{d}'
              os.makedirs(folder, exist_ok=True)
              full.resize((legacy, legacy), Image.LANCZOS).convert('RGB').save(f'{folder}/ic_launcher.png')
              r = full.resize((legacy, legacy), Image.LANCZOS)
              m = Image.new('L', (legacy * 4, legacy * 4), 0)
              ImageDraw.Draw(m).ellipse((0, 0, legacy * 4 - 1, legacy * 4 - 1), fill=255)
              r.putalpha(m.resize((legacy, legacy), Image.LANCZOS))
              r.save(f'{folder}/ic_launcher_round.png')
              fg.resize((foreground, foreground), Image.LANCZOS).save(f'{folder}/ic_launcher_foreground.png')
          os.makedirs(f'{res}/values', exist_ok=True)
          with open(f'{res}/values/ic_launcher_background.xml', 'w') as f:
              f.write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#000000</color>\n</resources>\n')
          for p in glob.glob(f'{res}/drawable*/splash.png'):
              w, h = Image.open(p).size
              Image.new('RGB', (w, h), (0, 0, 0)).save(p)
          print('Ícono y splash aplicados')
          PY
          fi

      - name: Controles de la app (native-player.js y addon-menu.js)
        run: |
          python3 - <<'PY'
          import os
          p = 'www/index.html'
          t = open(p, encoding='utf-8').read()
          for f in ('addon-menu.js', 'native-player.js', 'plugins.js', 'tv.js', 'update-check.js'):
              tag = '<script src="%s"></script>' % f
              if not os.path.exists('www/' + f):
                  print('::warning::Falta www/' + f + ' (súbelo a la carpeta www del repositorio)')
              elif tag not in t and '</body>' in t:
                  i = t.rfind('</body>')
                  t = t[:i] + tag + '\n' + t[i:]
          open(p, 'w', encoding='utf-8').write(t)
          PY
          grep -c "addon-menu.js\|native-player.js\|plugins.js\|tv.js\|update-check.js" www/index.html

      - name: Sincronizar con Android
        run: npx cap sync android

      - name: Enlace de retorno para iniciar sesión con Google (deep link)
        run: |
          python3 - <<'PY'
          m = 'android/app/src/main/AndroidManifest.xml'
          t = open(m, encoding='utf-8').read()
          if 'auth-callback' not in t:
              f = ('        <intent-filter>\n'
                   '            <action android:name="android.intent.action.VIEW" />\n'
                   '            <category android:name="android.intent.category.DEFAULT" />\n'
                   '            <category android:name="android.intent.category.BROWSABLE" />\n'
                   '            <data android:scheme="com.zineclick.app" android:host="auth-callback" />\n'
                   '        </intent-filter>\n')
              i = t.find('</activity>')
              assert i > 0, 'No se encontró <activity> en el manifest'
              t = t[:i] + f + '    ' + t[i:]
              open(m, 'w', encoding='utf-8').write(t)
          print('Deep link auth-callback añadido')
          PY
          grep -n "auth-callback" android/app/src/main/AndroidManifest.xml

      - name: Nombre de la app (Zynora)
        run: |
          F=android/app/src/main/res/values/strings.xml
          sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">Zynora</string>|' "$F"
          sed -i 's|<string name="title_activity_main">[^<]*</string>|<string name="title_activity_main">Zynora</string>|' "$F"
          grep -n "app_name\|title_activity_main" "$F"

      - name: Notificaciones (permiso y ícono pequeño)
        continue-on-error: true
        run: |
          python3 - <<'PY'
          m = 'android/app/src/main/AndroidManifest.xml'
          t = open(m, encoding='utf-8').read()
          if 'android.permission.POST_NOTIFICATIONS' not in t:
              k = t.find('<application')
              assert k > 0, 'No se encontró <application>'
              t = t[:k] + '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    ' + t[k:]
              open(m, 'w', encoding='utf-8').write(t)
          print('Permiso de notificaciones listo')
          PY
          grep -n "POST_NOTIFICATIONS" android/app/src/main/AndroidManifest.xml
          if [ -f icon-foreground.png ]; then
            python3 -m venv /tmp/venvnt
            /tmp/venvnt/bin/pip install pillow
            /tmp/venvnt/bin/python - <<'PY'
          from PIL import Image
          import os
          fg = Image.open('icon-foreground.png').convert('RGBA')
          a = fg.split()[3]
          lo, hi = a.getextrema()
          if lo > 200:
              print('El ícono no tiene transparencia: se deja el ícono pequeño por defecto')
          else:
              box = a.point(lambda v: 255 if v > 24 else 0).getbbox()
              mask = a.crop(box) if box else a
              side = max(mask.size)
              sq = Image.new('L', (side, side), 0)
              sq.paste(mask, ((side - mask.width) // 2, (side - mask.height) // 2))
              for d, px in {'mdpi': 24, 'hdpi': 36, 'xhdpi': 48, 'xxhdpi': 72, 'xxxhdpi': 96}.items():
                  folder = 'android/app/src/main/res/drawable-' + d
                  os.makedirs(folder, exist_ok=True)
                  m = sq.resize((px, px), Image.LANCZOS)
                  out = Image.new('RGBA', (px, px), (255, 255, 255, 0))
                  out.paste(Image.new('RGBA', (px, px), (255, 255, 255, 255)), (0, 0), m)
                  out.save(folder + '/ic_stat_zynora.png')
              print('Ícono de notificación creado')
          PY
          fi

      - name: Android TV (aparece en el menú de la tele, con banner)
        continue-on-error: true
        run: |
          python3 -m venv /tmp/venvtv
          /tmp/venvtv/bin/pip install pillow
          /tmp/venvtv/bin/python - <<'PY'
          from PIL import Image
          import os
          res = 'android/app/src/main/res/drawable'
          os.makedirs(res, exist_ok=True)
          if os.path.exists('icon.png'):
              ic = Image.open('icon.png').convert('RGBA').resize((300, 300), Image.LANCZOS)
              bn = Image.new('RGBA', (640, 360), (0, 0, 0, 255))
              bn.paste(ic, (170, 30), ic)
              bn.convert('RGB').save(res + '/tv_banner.png')
              print('Banner de TV creado')
          PY
          python3 - <<'PY'
          import os
          m = 'android/app/src/main/AndroidManifest.xml'
          t = open(m, encoding='utf-8').read()
          if 'android.software.leanback' not in t:
              k = t.find('<application')
              assert k > 0, 'No se encontró <application>'
              feat = ('<uses-feature android:name="android.software.leanback" android:required="false" />\n    '
                      '<uses-feature android:name="android.hardware.touchscreen" android:required="false" />\n    ')
              t = t[:k] + feat + t[k:]
          if 'LEANBACK_LAUNCHER' not in t:
              i = t.find('android.intent.category.LAUNCHER')
              assert i > 0, 'No se encontró la categoría LAUNCHER'
              j = t.find('/>', i) + 2
              t = t[:j] + '\n                <category android:name="android.intent.category.LEANBACK_LAUNCHER" />' + t[j:]
          if os.path.exists('android/app/src/main/res/drawable/tv_banner.png') and 'android:banner' not in t:
              t = t.replace('<application', '<application\n        android:banner="@drawable/tv_banner"', 1)
          open(m, 'w', encoding='utf-8').write(t)
          print('Manifest listo para Android TV')
          PY
          grep -n "leanback\|LEANBACK\|banner" android/app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          p = 'www/index.html'
          t = open(p, encoding='utf-8').read()
          old = 'if(document.getElementById("detailModal").classList.contains("open")){modalBack();return}'
          if 'ZTV.back' not in t and t.count(old) == 1:
              t = t.replace(old, 'if(window.ZTV&&window.ZTV.back&&window.ZTV.back(ev))return;' + old)
              open(p, 'w', encoding='utf-8').write(t)
              print('Boton Atras para TV listo')
          else:
              print('AVISO: no se pudo ajustar el boton Atras')
          PY

      - name: Clave de firma fija (para poder actualizar sin desinstalar)
        env:
          KEYSTORE_B64: ${{ secrets.ZINE_KEYSTORE_B64 }}
          KS_PASS_IN: ${{ secrets.ZINE_KEYSTORE_PASSWORD }}
          KEY_ALIAS_IN: ${{ secrets.ZINE_KEY_ALIAS }}
          KEY_PASS_IN: ${{ secrets.ZINE_KEY_PASSWORD }}
          EXPECTED_SHA256: ${{ vars.SIGN_SHA256 }}
        run: |
          set -e
          KS=android/app/zine.keystore
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > "$KS"
            echo "Usando la clave del secreto ZINE_KEYSTORE_B64"
          elif [ -f zineclick-debug.keystore ]; then
            cp zineclick-debug.keystore "$KS"
            echo "::warning::La clave de firma sigue dentro del repositorio (público). Guárdala en el secreto ZINE_KEYSTORE_B64 y borra zineclick-debug.keystore del repo."
          else
            echo "::error::No hay clave de firma. Crea el secreto ZINE_KEYSTORE_B64 en Settings > Secrets and variables > Actions."
            exit 1
          fi
          KS_PASS="${KS_PASS_IN:-android}"
          KEY_ALIAS="${KEY_ALIAS_IN:-androiddebugkey}"
          KEY_PASS="${KEY_PASS_IN:-$KS_PASS}"
          echo "::add-mask::$KS_PASS"
          echo "::add-mask::$KEY_PASS"
          if ! keytool -list -v -keystore "$KS" -storepass "$KS_PASS" -alias "$KEY_ALIAS" > /tmp/ks.txt 2>&1; then
            echo "::error::No se pudo abrir la clave de firma (base64 dañado, o alias/contraseña distintos a androiddebugkey/android). Si usaste otros, crea los secretos ZINE_KEY_ALIAS, ZINE_KEYSTORE_PASSWORD y ZINE_KEY_PASSWORD."
            head -5 /tmp/ks.txt
            exit 1
          fi
          SHA=$(grep -m1 "SHA256:" /tmp/ks.txt | sed 's/.*SHA256: *//')
          echo "Huella SHA-256 de la clave: $SHA"
          NORM=$(echo "$SHA" | tr -d ': ' | tr 'A-F' 'a-f')
          if [ -n "$EXPECTED_SHA256" ]; then
            EXP=$(echo "$EXPECTED_SHA256" | tr -d ': ' | tr 'A-F' 'a-f')
            if [ "$EXP" != "$NORM" ]; then
              echo "::error::La clave de firma NO coincide con la huella guardada en la variable SIGN_SHA256. Esta compilación no actualizaría la app instalada. Revisa el secreto ZINE_KEYSTORE_B64."
              exit 1
            fi
            echo "La huella coincide con SIGN_SHA256"
          else
            echo "::notice::Para blindar las actualizaciones, crea la variable SIGN_SHA256 con este valor: $SHA"
          fi
          echo "KS_SHA_NORM=$NORM" >> "$GITHUB_ENV"
          echo "ZINE_KS_PASS=$KS_PASS" >> "$GITHUB_ENV"
          echo "ZINE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ZINE_KEY_PASS=$KEY_PASS" >> "$GITHUB_ENV"

      - name: Firma explícita + número de versión que siempre sube
        run: |
          python3 - <<'PY'
          import re, time
          p = 'android/app/build.gradle'
          s = open(p, encoding='utf-8').read()
          # 1) versionCode = segundos desde 1970: siempre mayor que cualquier compilación anterior
          vc = str(int(time.time()))
          vn = '1.0.${{ github.run_number }}'
          s, n1 = re.subn(r'versionCode\s*=?\s*\d+', 'versionCode ' + vc, s, count=1)
          s, n2 = re.subn(r'versionName\s*=?\s*"[^"]*"', 'versionName "' + vn + '"', s, count=1)
          assert n1 and n2, 'No se encontró versionCode/versionName en build.gradle'
          # 2) la compilación usa SIEMPRE nuestra clave
          if 'signingConfigs.zine' not in s:
              block = ("signingConfigs {\n        zine {\n            storeFile file('zine.keystore')\n"
                       "            storePassword System.getenv('ZINE_KS_PASS')\n"
                       "            keyAlias System.getenv('ZINE_KEY_ALIAS')\n"
                       "            keyPassword System.getenv('ZINE_KEY_PASS')\n        }\n    }\n    ")
              assert 'buildTypes {' in s, 'No se encontró buildTypes en build.gradle'
              s = s.replace('buildTypes {', block + 'buildTypes {\n        debug {\n            signingConfig signingConfigs.zine\n        }', 1)
          open(p, 'w', encoding='utf-8').write(s)
          print('versionCode', vc, '| versionName', vn)
          PY
          grep -n "versionCode\|versionName\|signingConfig" android/app/build.gradle

      - name: Ocultar barra de desplazamiento nativa
        continue-on-error: true
        run: |
          F=android/app/src/main/java/com/zineclick/app/MainActivity.java
          python3 - "$F" <<'PY'
          import sys
          p = sys.argv[1]
          s = open(p, encoding='utf-8').read()
          if 'setVerticalScrollBarEnabled' not in s and 'public class MainActivity extends BridgeActivity {}' in s:
              s = s.replace('import com.getcapacitor.BridgeActivity;', 'import android.webkit.WebView;\nimport com.getcapacitor.BridgeActivity;')
              s = s.replace('public class MainActivity extends BridgeActivity {}', 'public class MainActivity extends BridgeActivity {\n    @Override\n    public void onStart() {\n        super.onStart();\n        WebView w = getBridge() != null ? getBridge().getWebView() : null;\n        if (w != null) {\n            w.setVerticalScrollBarEnabled(false);\n            w.setHorizontalScrollBarEnabled(false);\n        }\n    }\n}')
              open(p, 'w', encoding='utf-8').write(s)
              print('Barra nativa desactivada')
          PY

      - name: Reproductor nativo con sonido (VLC) - opcional
        id: native
        continue-on-error: true
        run: |
          set -e
          PKG_DIR=android/app/src/main/java/com/zineclick/app
          test -d "$PKG_DIR"
          cp android/app/build.gradle android/app/build.gradle.bak
          cp android/app/src/main/AndroidManifest.xml android/app/src/main/AndroidManifest.xml.bak
          cp "$PKG_DIR/MainActivity.java" "$PKG_DIR/MainActivity.java.bak"
          cat > "$PKG_DIR/MainActivity.java" <<'JAVA_MAIN'
          package com.zineclick.app;

          import android.os.Bundle;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(ZinePlayerPlugin.class);
                  super.onCreate(savedInstanceState);
              }

              @Override
              public void onStart() {
                  super.onStart();
                  WebView w = getBridge() != null ? getBridge().getWebView() : null;
                  if (w != null) {
                      w.setVerticalScrollBarEnabled(false);
                      w.setHorizontalScrollBarEnabled(false);
                  }
              }
          }
          JAVA_MAIN
          cat > "$PKG_DIR/ZinePlayerPlugin.java" <<'JAVA_PLUGIN'
          package com.zineclick.app;

          import android.app.Activity;
          import android.content.Context;
          import android.view.inputmethod.InputMethodManager;
          import android.content.pm.ActivityInfo;
          import android.graphics.Bitmap;
          import android.graphics.Color;
          import android.media.MediaMetadataRetriever;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Handler;
          import android.os.Looper;
          import android.util.Base64;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.webkit.WebView;

          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;

          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          import org.videolan.libvlc.LibVLC;
          import org.videolan.libvlc.Media;
          import org.videolan.libvlc.MediaPlayer;
          import org.videolan.libvlc.util.VLCVideoLayout;

          import java.io.ByteArrayOutputStream;
          import java.util.ArrayList;
          import java.util.HashMap;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          /**
           * Reproductor VLC sin pantalla propia: el video se dibuja DETRÁS del WebView
           * y los controles son HTML (native-player.js).
           */
          @CapacitorPlugin(name = "ZinePlayer")
          public class ZinePlayerPlugin extends Plugin {
              private LibVLC libVLC;
              private MediaPlayer player;
              private VLCVideoLayout videoLayout;
              private ViewGroup videoParent;
              private final Handler handler = new Handler(Looper.getMainLooper());
              private String url = "";
          private String referer = "";
          private String uagent = "";
              private String aspect = "fit";
              private boolean active = false;
              private int retries = 0;
              private int qualityH = 0;
              private boolean suspended = false;
              private boolean buffering = true;
              private boolean resumePlaying = true;
              private long resumeAt = 0;
              private final ExecutorService thumbEx = Executors.newSingleThreadExecutor();
              private final ExecutorService relEx = Executors.newSingleThreadExecutor();
              private MediaMetadataRetriever mmr;
              private String mmrUrl = "";
              private boolean mmrFailed = false;

              private void pushState() {
                  try {
                      if (!active || suspended || player == null) return;
                      JSObject o = new JSObject();
                      o.put("time", Math.max(player.getTime(), 0L));
                      o.put("length", Math.max(player.getLength(), 0L));
                      o.put("playing", player.isPlaying());
                      o.put("buffering", buffering);
                      notifyListeners("znpState", o);
                  } catch (Throwable t) {
                      // se ignora
                  }
              }

              private final Runnable ticker = new Runnable() {
                  @Override
                  public void run() {
                      if (active && !suspended && player != null) {
                          try {
                              JSObject o = new JSObject();
                              o.put("time", Math.max(player.getTime(), 0L));
                              o.put("length", Math.max(player.getLength(), 0L));
                              o.put("playing", player.isPlaying());
                              o.put("buffering", buffering);
                              notifyListeners("znpState", o);
                          } catch (Throwable t) {
                              // se ignora: el próximo ciclo lo reintenta
                          }
                      }
                      if (active) handler.postDelayed(this, 500);
                  }
              };

              private final MediaPlayer.EventListener listener = new MediaPlayer.EventListener() {
                  @Override
                  public void onEvent(MediaPlayer.Event e) {
                      switch (e.type) {
                          case MediaPlayer.Event.Buffering:
                              buffering = e.getBuffering() < 100f;
                              break;
                          case MediaPlayer.Event.Paused:
                              pushState();
                              break;
                          case MediaPlayer.Event.Playing:
                              buffering = false;
                              retries = 0;
                              applyAspect();
                              pushState();
                              break;
                          case MediaPlayer.Event.EndReached:
                              notifyListeners("znpEnded", new JSObject());
                              break;
                          case MediaPlayer.Event.EncounteredError:
                              if (retries < 2 && active && !suspended && player != null) {
                                  retries++;
                                  final long rt = Math.max(player.getTime(), 0L);
                                  handler.postDelayed(new Runnable() {
                                      @Override
                                      public void run() {
                                          try {
                                              if (player == null || !active || suspended) return;
                                              player.stop();
                                              player.detachViews();
                                              attachAndPlay(rt, true);
                                          } catch (Throwable t) {
                                              // si el reintento falla, el siguiente error avisa a la página
                                          }
                                      }
                                  }, 1000);
                                  break;
                              }
                              JSObject o = new JSObject();
                              o.put("message", "VLC no pudo reproducir este video");
                              notifyListeners("znpError", o);
                              break;
                          default:
                              break;
                      }
                  }
              };

              private void ui(Runnable r) {
                  getActivity().runOnUiThread(r);
              }

              private void applyAspect() {
                  if (player == null) return;
                  try {
                      MediaPlayer.ScaleType s;
                      switch (aspect) {
                          case "zoom": s = MediaPlayer.ScaleType.SURFACE_FIT_SCREEN; break;
                          case "fill": s = MediaPlayer.ScaleType.SURFACE_FILL; break;
                          case "16:9": s = MediaPlayer.ScaleType.SURFACE_16_9; break;
                          case "4:3": s = MediaPlayer.ScaleType.SURFACE_4_3; break;
                          default: s = MediaPlayer.ScaleType.SURFACE_BEST_FIT; break;
                      }
                      player.setVideoScale(s);
                  } catch (Throwable t) {
                      // sin efecto si el video aún no está listo
                  }
              }

              private void immersive(boolean on) {
                  Activity a = getActivity();
                  if (a == null) return;
                  try {
                      WindowInsetsControllerCompat c = WindowCompat.getInsetsController(a.getWindow(), a.getWindow().getDecorView());
                      if (c == null) return;
                      if (on) {
                          c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                          c.hide(WindowInsetsCompat.Type.systemBars());
                      } else {
                          c.show(WindowInsetsCompat.Type.systemBars());
                      }
                      if (Build.VERSION.SDK_INT >= 28) {
                          WindowManager.LayoutParams lp = a.getWindow().getAttributes();
                          lp.layoutInDisplayCutoutMode = on
                                  ? WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                                  : WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_DEFAULT;
                          a.getWindow().setAttributes(lp);
                      }
                  } catch (Throwable t) {
                      // las barras del sistema no son críticas
                  }
              }

              private void attachAndPlay(long seekTo, boolean thenPlay) {
                  player.attachViews(videoLayout, null, true, false);
                  Media m = new Media(libVLC, Uri.parse(url));
                  if (!referer.isEmpty()) m.addOption(":http-referrer=" + referer);
                  if (!uagent.isEmpty()) m.addOption(":http-user-agent=" + uagent);
                  m.addOption(":ipv4-timeout=8000");
                  m.addOption(":network-caching=3000");
                  if (qualityH > 0) m.addOption(":adaptive-maxheight=" + qualityH);
                  player.setMedia(m);
                  m.release();
                  player.play();
                  final long at = seekTo;
                  if (at > 1000) {
                      handler.postDelayed(new Runnable() {
                          @Override
                          public void run() {
                              if (player != null) player.setTime(at);
                          }
                      }, 1500);
                  }
                  if (!thenPlay) {
                      handler.postDelayed(new Runnable() {
                          @Override
                          public void run() {
                              if (player != null && player.isPlaying()) player.pause();
                          }
                      }, 1800);
                  }
              }

              private void startPlayback(String u) {
                  teardown();
                  Activity a = getActivity();
                  WebView wv = getBridge().getWebView();
                  videoParent = (ViewGroup) wv.getParent();
                  videoLayout = new VLCVideoLayout(a);
                  videoParent.addView(videoLayout, 0,
                          new ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  wv.setBackgroundColor(Color.TRANSPARENT);
                  a.setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE);
                  a.getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  immersive(true);

                  url = u;
                  aspect = "fit";
                  active = true;
                  suspended = false;
                  buffering = true;
                  ArrayList<String> args = new ArrayList<String>();
                  retries = 0;
                  qualityH = 0;
                  args.add("--network-caching=3000");
                  args.add("--file-caching=3000");
                  args.add("--http-reconnect");
                  libVLC = new LibVLC(a, args);
                  player = new MediaPlayer(libVLC);
                  player.setEventListener(listener);
                  attachAndPlay(0, true);
                  handler.removeCallbacks(ticker);
                  handler.post(ticker);
              }

              private void teardown() {
                  active = false;
                  suspended = false;
                  handler.removeCallbacksAndMessages(null);
                  final MediaPlayer oldPlayer = player;
                  final LibVLC oldLib = libVLC;
                  player = null;
                  libVLC = null;
                  try {
                      if (oldPlayer != null) {
                          oldPlayer.setEventListener(null);
                          oldPlayer.detachViews();
                      }
                  } catch (Throwable t) {
                      // se sigue liberando el resto
                  }
                  try {
                      if (videoLayout != null && videoParent != null) videoParent.removeView(videoLayout);
                  } catch (Throwable t) {
                      // idem
                  }
                  videoLayout = null;
                  thumbEx.execute(new Runnable() {
                      @Override
                      public void run() {
                          closeRetriever();
                      }
                  });
                  relEx.execute(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              if (oldPlayer != null) {
                                  oldPlayer.stop();
                                  oldPlayer.release();
                              }
                          } catch (Throwable t) {
                              // idem
                          }
                          try {
                              if (oldLib != null) oldLib.release();
                          } catch (Throwable t) {
                              // idem
                          }
                      }
                  });
              }

              private void restoreWindow() {
                  Activity a = getActivity();
                  if (a == null) return;
                  try {
                      a.setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED);
                      a.getWindow().clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                      immersive(false);
                      WebView wv = getBridge().getWebView();
                      if (wv != null) wv.setBackgroundColor(Color.BLACK);
                  } catch (Throwable t) {
                      // idem
                  }
              }

              /* ---------------- métodos que llama la página ---------------- */

              @PluginMethod
